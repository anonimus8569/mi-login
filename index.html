<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Tavola — Mi cuenta</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f7f2ea;
      --warm: #efe8d8;
      --terracotta: #b85c38;
      --terracotta-dark: #8c3e22;
      --terracotta-light: #f0ddd5;
      --olive: #6b7c4a;
      --olive-light: #e8edde;
      --ink: #1e1a15;
      --muted: #7a6f63;
      --border: #ddd5c5;
      --white: #fff;
    }
    body { font-family: 'Jost', sans-serif; background: var(--cream); min-height: 100vh; }

    .page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse at 80% 10%, rgba(184,92,56,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 10% 90%, rgba(107,124,74,0.07) 0%, transparent 55%);
    }

    .card {
      background: var(--white);
      border-radius: 4px;
      border: 1px solid var(--border);
      padding: 2.75rem 3rem;
      width: 100%; max-width: 460px;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--terracotta);
      border-radius: 4px 4px 0 0;
    }

    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px; font-weight: 300; font-style: italic;
      color: var(--terracotta); letter-spacing: 1px; line-height: 1; margin-bottom: 2px;
    }
    .brand-sub { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
    .brand-divider { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .brand-divider::before, .brand-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .brand-divider span { font-size: 14px; color: var(--terracotta); opacity: 0.6; }

    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--ink); margin-bottom: 0.3rem; }
    .card-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.75rem; font-weight: 300; }

    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 0.4rem; }
    .form-input {
      width: 100%; padding: 0.65rem 0.85rem;
      border: 1px solid var(--border); border-radius: 3px;
      font-size: 14px; font-family: 'Jost', sans-serif; font-weight: 300;
      color: var(--ink); background: var(--cream); outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-input:focus { border-color: var(--terracotta); background: var(--white); }
    .form-input::placeholder { color: #bbb; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .btn-primary {
      width: 100%; padding: 0.8rem;
      background: var(--terracotta); color: var(--white);
      border: none; border-radius: 3px;
      font-size: 11px; font-weight: 500; font-family: 'Jost', sans-serif;
      letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--terracotta-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

    .link-row { text-align: center; font-size: 13px; color: var(--muted); margin-top: 1.25rem; font-weight: 300; }
    .link-btn {
      background: none; border: none; color: var(--terracotta); font-weight: 400;
      cursor: pointer; font-size: 13px; font-family: 'Jost', sans-serif;
      text-decoration: underline; text-underline-offset: 2px;
    }

    .alert { padding: 0.7rem 0.9rem; border-radius: 3px; font-size: 13px; margin-bottom: 1rem; font-weight: 300; }
    .alert-error { background: #fef2f2; color: #c0392b; border-left: 3px solid #c0392b; }

    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DASHBOARD */
    .dashboard { min-height: 100vh; background: var(--cream); background-image: radial-gradient(ellipse at 80% 10%, rgba(184,92,56,0.06) 0%, transparent 60%); }
    .topbar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 0 2.5rem; height: 58px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; font-style: italic; color: var(--terracotta); }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .topbar-user { font-size: 13px; color: var(--muted); font-weight: 300; }
    .topbar-user strong { color: var(--ink); font-weight: 500; }
    .btn-logout {
      background: none; border: 1px solid var(--border); border-radius: 3px;
      padding: 0.4rem 0.85rem; font-size: 11px; font-family: 'Jost', sans-serif;
      letter-spacing: 1px; text-transform: uppercase; color: var(--muted); cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: var(--terracotta); color: var(--terracotta); }

    .dash-content { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .dash-welcome { margin-bottom: 2rem; }
    .dash-welcome h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; color: var(--ink); }
    .dash-welcome h1 em { color: var(--terracotta); font-style: italic; }
    .dash-welcome p { font-size: 13px; color: var(--muted); font-weight: 300; margin-top: 4px; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 4px; padding: 1.25rem 1.5rem; position: relative; overflow: hidden; }
    .stat-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; }
    .stat-card.puntos::after { background: var(--terracotta); }
    .stat-card.reservas::after { background: var(--olive); }
    .stat-card.pedidos::after { background: #b8923a; }
    .stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
    .stat-value { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--ink); line-height: 1; }
    .stat-value.puntos { color: var(--terracotta); }
    .stat-hint { font-size: 11px; color: var(--muted); font-weight: 300; margin-top: 6px; }

    .section { background: var(--white); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 1.25rem; overflow: hidden; }
    .section-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--cream); }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 400; color: var(--ink); }
    .section-badge { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .badge-terracotta { background: var(--terracotta-light); color: var(--terracotta-dark); }
    .badge-olive { background: var(--olive-light); color: var(--olive); }

    .reserva-item { display: flex; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--warm); gap: 1rem; }
    .reserva-item:last-child { border-bottom: none; }
    .reserva-fecha { text-align: center; min-width: 48px; }
    .reserva-dia { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--terracotta); line-height: 1; }
    .reserva-mes { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 500; }
    .reserva-sep { width: 1px; height: 36px; background: var(--border); }
    .reserva-info { flex: 1; }
    .reserva-nombre { font-size: 14px; color: var(--ink); font-weight: 400; margin-bottom: 2px; }
    .reserva-detalle { font-size: 12px; color: var(--muted); font-weight: 300; }
    .reserva-estado { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .estado-confirmada { background: var(--olive-light); color: var(--olive); }
    .estado-pendiente { background: #fef9ec; color: #b8923a; }

    .pedido-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--warm); }
    .pedido-item:last-child { border-bottom: none; }
    .pedido-left { display: flex; align-items: center; gap: 1rem; }
    .pedido-icono { width: 36px; height: 36px; border-radius: 50%; background: var(--cream); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .pedido-nombre { font-size: 14px; color: var(--ink); font-weight: 400; margin-bottom: 2px; }
    .pedido-fecha { font-size: 12px; color: var(--muted); font-weight: 300; }
    .pedido-precio { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; color: var(--ink); }

    .puntos-section { padding: 1.5rem; }
    .puntos-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 6px; font-weight: 300; }
    .puntos-bar { height: 6px; background: var(--warm); border-radius: 3px; overflow: hidden; margin-bottom: 0.75rem; }
    .puntos-fill { height: 100%; background: var(--terracotta); border-radius: 3px; }
    .puntos-hint { font-size: 12px; color: var(--muted); font-weight: 300; text-align: center; }
    .puntos-hint strong { color: var(--terracotta); font-weight: 500; }

    .confirm-screen { text-align: center; }
    .confirm-icon { font-size: 44px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    const sb = createClient(
      "https://skllslblccxvduaqejfs.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbGxzbGJsY2N4dmR1YXFlamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDQ3OTAsImV4cCI6MjA5NjUyMDc5MH0.ztGkc572MXH8qQK0hruAUXN64hXMuU4maPgSi2Dg6WQ"
    );

    const RESERVAS = [
      { dia: "14", mes: "Jun", nombre: "Mesa para 2 — Terraza", hora: "20:30 h", estado: "confirmada" },
      { dia: "22", mes: "Jun", nombre: "Mesa para 4 — Interior", hora: "21:00 h", estado: "pendiente" },
    ];
    const PEDIDOS = [
      { icono: "🍝", nombre: "Tagliatelle al ragù + Tiramisú", fecha: "3 jun 2025", precio: "$28.50" },
      { icono: "🍕", nombre: "Pizza Margherita + Vino tinto", fecha: "21 may 2025", precio: "$22.00" },
      { icono: "🥗", nombre: "Antipasto della casa", fecha: "5 may 2025", precio: "$14.00" },
    ];
    const PUNTOS = 340;
    const PUNTOS_SIGUIENTE = 500;

    const Brand = () => (
      <div className="brand">
        <div className="brand-logo">La Tavola</div>
        <div className="brand-sub">Trattoria italiana</div>
        <div className="brand-divider"><span>✦</span></div>
      </div>
    );

    function LoginForm({ onSwitch }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const handleLogin = async (e) => {
        e.preventDefault(); setError(""); setLoading(true);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setError("Correo o contraseña incorrectos. Intenta de nuevo.");
        setLoading(false);
      };
      return (
        <div className="page">
          <div className="card">
            <Brand />
            <h2 className="card-title">Accede a tu cuenta</h2>
            <p className="card-subtitle">Gestiona tus reservas y pedidos</p>
            {error && <div className="alert alert-error">{error}</div>}
            <form onSubmit={handleLogin}>
              <div className="form-group">
                <label className="form-label">Correo electrónico</label>
                <input className="form-input" type="email" placeholder="tu@correo.com" value={email} onChange={e => setEmail(e.target.value)} required />
              </div>
              <div className="form-group">
                <label className="form-label">Contraseña</label>
                <input className="form-input" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>
              <button className="btn-primary" type="submit" disabled={loading}>
                {loading && <span className="spinner" />}{loading ? "Entrando..." : "Iniciar sesión"}
              </button>
            </form>
            <div className="link-row">¿Aún no tienes cuenta? <button className="link-btn" onClick={onSwitch}>Regístrate gratis</button></div>
          </div>
        </div>
      );
    }

    function RegisterForm({ onSwitch }) {
      const [form, setForm] = useState({ nombre: "", email: "", telefono: "", nacimiento: "", password: "" });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [done, setDone] = useState(false);
      const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));
      const handleRegister = async (e) => {
        e.preventDefault(); setError(""); setLoading(true);
        const { error } = await sb.auth.signUp({
          email: form.email, password: form.password,
          options: { data: { nombre_completo: form.nombre, telefono: form.telefono, fecha_nacimiento: form.nacimiento } }
        });
        if (error) setError(error.message); else setDone(true);
        setLoading(false);
      };
      if (done) return (
        <div className="page"><div className="card confirm-screen">
          <Brand />
          <div className="confirm-icon">✉️</div>
          <h2 className="card-title">¡Benvenuto!</h2>
          <p className="card-subtitle" style={{ marginBottom: "1.5rem" }}>
            Enviamos un enlace de confirmación a <strong>{form.email}</strong>.<br />Confírmalo para activar tu cuenta en La Tavola.
          </p>
          <button className="link-btn" onClick={onSwitch}>Ir al inicio de sesión</button>
        </div></div>
      );
      return (
        <div className="page">
          <div className="card">
            <Brand />
            <h2 className="card-title">Únete a La Tavola</h2>
            <p className="card-subtitle">Reservas fáciles, puntos y beneficios exclusivos</p>
            {error && <div className="alert alert-error">{error}</div>}
            <form onSubmit={handleRegister}>
              <div className="form-group">
                <label className="form-label">Nombre completo</label>
                <input className="form-input" type="text" placeholder="María Rossi" value={form.nombre} onChange={set("nombre")} required />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Teléfono</label>
                  <input className="form-input" type="tel" placeholder="+593 99..." value={form.telefono} onChange={set("telefono")} />
                </div>
                <div className="form-group">
                  <label className="form-label">Fecha de nacimiento</label>
                  <input className="form-input" type="date" value={form.nacimiento} onChange={set("nacimiento")} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Correo electrónico</label>
                <input className="form-input" type="email" placeholder="tu@correo.com" value={form.email} onChange={set("email")} required />
              </div>
              <div className="form-group">
                <label className="form-label">Contraseña</label>
                <input className="form-input" type="password" placeholder="Mínimo 6 caracteres" value={form.password} onChange={set("password")} minLength={6} required />
              </div>
              <button className="btn-primary" type="submit" disabled={loading}>
                {loading && <span className="spinner" />}{loading ? "Creando cuenta..." : "Crear mi cuenta"}
              </button>
            </form>
            <div className="link-row">¿Ya tienes cuenta? <button className="link-btn" onClick={onSwitch}>Inicia sesión</button></div>
          </div>
        </div>
      );
    }

    function Dashboard({ user }) {
      const meta = user.user_metadata || {};
      const nombre = meta.nombre_completo || user.email;
      const primerNombre = nombre.split(" ")[0];
      const pct = Math.round((PUNTOS / PUNTOS_SIGUIENTE) * 100);
      return (
        <div className="dashboard">
          <div className="topbar">
            <div className="topbar-brand">La Tavola</div>
            <div className="topbar-right">
              <span className="topbar-user">Hola, <strong>{primerNombre}</strong></span>
              <button className="btn-logout" onClick={() => sb.auth.signOut()}>Salir</button>
            </div>
          </div>
          <div className="dash-content">
            <div className="dash-welcome">
              <h1>Benvenuto, <em>{primerNombre}</em></h1>
              <p>Aquí tienes un resumen de tu actividad en La Tavola</p>
            </div>
            <div className="stats-row">
              <div className="stat-card puntos">
                <div className="stat-label">Puntos acumulados</div>
                <div className="stat-value puntos">{PUNTOS}</div>
                <div className="stat-hint">Próximo nivel: {PUNTOS_SIGUIENTE} pts</div>
              </div>
              <div className="stat-card reservas">
                <div className="stat-label">Reservas activas</div>
                <div className="stat-value">{RESERVAS.length}</div>
                <div className="stat-hint">Próxima: 14 jun</div>
              </div>
              <div className="stat-card pedidos">
                <div className="stat-label">Pedidos realizados</div>
                <div className="stat-value">{PEDIDOS.length}</div>
                <div className="stat-hint">Último: 3 jun 2025</div>
              </div>
            </div>
            <div className="section">
              <div className="section-header">
                <span className="section-title">Próximas reservas</span>
                <span className="section-badge badge-terracotta">Junio 2025</span>
              </div>
              {RESERVAS.map((r, i) => (
                <div className="reserva-item" key={i}>
                  <div className="reserva-fecha">
                    <div className="reserva-dia">{r.dia}</div>
                    <div className="reserva-mes">{r.mes}</div>
                  </div>
                  <div className="reserva-sep" />
                  <div className="reserva-info">
                    <div className="reserva-nombre">{r.nombre}</div>
                    <div className="reserva-detalle">{r.hora}</div>
                  </div>
                  <span className={"reserva-estado estado-" + r.estado}>
                    {r.estado === "confirmada" ? "Confirmada" : "Pendiente"}
                  </span>
                </div>
              ))}
            </div>
            <div className="section">
              <div className="section-header">
                <span className="section-title">Historial de pedidos</span>
                <span className="section-badge badge-olive">{PEDIDOS.length} pedidos</span>
              </div>
              {PEDIDOS.map((p, i) => (
                <div className="pedido-item" key={i}>
                  <div className="pedido-left">
                    <div className="pedido-icono">{p.icono}</div>
                    <div>
                      <div className="pedido-nombre">{p.nombre}</div>
                      <div className="pedido-fecha">{p.fecha}</div>
                    </div>
                  </div>
                  <div className="pedido-precio">{p.precio}</div>
                </div>
              ))}
            </div>
            <div className="section">
              <div className="section-header">
                <span className="section-title">Mis puntos</span>
                <span className="section-badge badge-terracotta">Nivel Classico</span>
              </div>
              <div className="puntos-section">
                <div className="puntos-bar-labels">
                  <span>{PUNTOS} pts</span>
                  <span>{PUNTOS_SIGUIENTE} pts → Nivel Speciale</span>
                </div>
                <div className="puntos-bar">
                  <div className="puntos-fill" style={{ width: pct + "%" }} />
                </div>
                <div className="puntos-hint">
                  Te faltan <strong>{PUNTOS_SIGUIENTE - PUNTOS} puntos</strong> para desbloquear el nivel Speciale y obtener un postre gratis en tu próxima visita 🍮
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [session, setSession] = useState(null);
      const [view, setView] = useState("login");
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        sb.auth.getSession().then(({ data: { session } }) => { setSession(session); setLoading(false); });
        const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => setSession(session));
        return () => subscription.unsubscribe();
      }, []);
      if (loading) return <div className="page"><p style={{ color: "#aaa", fontSize: 13 }}>Cargando...</p></div>;
      if (session) return <Dashboard user={session.user} />;
      return view === "login"
        ? <LoginForm onSwitch={() => setView("register")} />
        : <RegisterForm onSwitch={() => setView("login")} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
