<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KO-ffee 커피 — Specialty Coffee & Dojang</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Paleta Taegeukgi Premium (Taekwondo WTF) */
  --yang:#CD2E3A;      
  --yang-dark:#9a1e28;
  --yang-glow:rgba(205,46,58,.14);
  --eum:#003478;       
  --eum-light:#e8eef8;
  --eum-glow:rgba(0,52,120,.12);
  /* Dobok & Tonos de Arroz/Papel */
  --dobok:#FAFAF8;     
  --ivory:#F5F2EC;     
  --paper:#EDE9E0;     
  --linen:#E8E3D8;
  /* Tintas */
  --ink:#1C1C1C;
  --ink-soft:#2E2E2E;
  --muted:#7A7468;
  --muted-light:#A8A29A;
  /* Bordes */
  --border:#DDD8CF;
  --border-dark:#2A2A2A;
  /* Panel de Staff Oscuro */
  --staff-bg:#0E0E0E;
  --staff-card:#1A1A1A;
  --staff-border:#272727;
  /* Oro Cinturón Negro */
  --gold:#C4962A;
  --gold-light:#F5E8C0;
  /* Estados */
  --ok:#1E7A45;
  --ok-bg:rgba(30,122,69,.1);
  --warn:#B07A1A;
  --warn-bg:rgba(176,122,26,.1);
}
body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
.hangul{font-family:'Noto Sans KR',sans-serif}
.myeongjo{font-family:'Nanum Myeongjo',serif}

/* --- ELEMENTOS DE DISEÑO --- */
.taegeuk-divider{display:flex;align-items:center;gap:1rem;margin:0 auto}
.taegeuk-divider::before,.taegeuk-divider::after{content:'';flex:1;height:1px}
.td-dark::before,.td-dark::after{background:rgba(255,255,255,.08)}
.td-light::before,.td-light::after{background:var(--border)}
.trigram{font-size:22px;opacity:.35;user-select:none}

/* --- LANDING --- */
.landing{background:var(--ink);color:var(--dobok);min-height:100vh;overflow:hidden}
.land-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;background:rgba(14,14,14,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--staff-border)}
.land-logo{display:flex;align-items:baseline;gap:8px}
.land-logo-main{font-family:'Nanum Myeongjo',serif;font-size:22px;font-weight:800;color:var(--dobok);letter-spacing:2px}
.land-logo-main span{color:var(--yang)}
.land-logo-hangul{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:300;color:rgba(255,255,255,.28);letter-spacing:1px}
.land-nav-links{display:flex;gap:2rem}
.land-nav-links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);cursor:pointer;transition:color .2s;font-weight:500}
.land-nav-links a:hover{color:var(--dobok)}
.btn-nav-login{padding:.45rem 1.5rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-nav-login:hover{background:var(--yang-dark)}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7rem 2rem 4rem;position:relative;overflow:hidden}
.hero-bg-taegeuk{position:absolute;width:600px;height:600px;border-radius:50%;background:conic-gradient(from 180deg at 50% 50%,var(--yang) 0deg,var(--yang) 180deg,var(--eum) 180deg,var(--eum) 360deg);opacity:.035;filter:blur(2px);pointer-events:none}
.hero-trigrams{position:absolute;font-size:100px;opacity:.03;letter-spacing:20px;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.hero-eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--yang);margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:28px;height:1px;background:var(--yang);opacity:.5}
.hero-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(50px,8vw,100px);font-weight:800;letter-spacing:3px;line-height:.88;margin-bottom:.5rem;position:relative;z-index:1}
.hero-title span{color:var(--yang)}
.hero-hangul-sub{font-family:'Noto Sans KR',sans-serif;font-size:clamp(16px,2.5vw,28px);font-weight:300;color:rgba(255,255,255,.22);letter-spacing:6px;margin-bottom:.85rem}
.hero-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2.5rem;font-weight:400}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn-hero-yang{padding:.9rem 2.75rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-hero-yang:hover{background:var(--yang-dark)}

/* --- AUTH SHELL --- */
.auth-page{min-height:100vh;display:flex;background:var(--ink);color:var(--dobok)}
.auth-container{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.auth-card{background:var(--staff-card);border:1px solid var(--staff-border);border-radius:4px;padding:2.5rem 2.75rem;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:2rem}
.auth-brand-text{font-family:'Nanum Myeongjo',serif;font-size:24px;font-weight:800;letter-spacing:2px}
.auth-brand-text span{color:var(--yang)}
.fg{margin-bottom:1rem}
.fl{display:block;font-size:11px;font-weight:500;color:var(--muted-light);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.4rem}
.fi{width:100%;padding:0.75rem 1rem;border:1px solid var(--staff-border);border-radius:2px;font-size:14px;font-family:'Inter',sans-serif;color:var(--dobok);background:var(--ink);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--yang)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-yang{width:100%;padding:0.85rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-yang:hover{background:var(--yang-dark)}
.link-row{text-align:center;font-size:13px;color:var(--muted-light);margin-top:1.5rem}
.link-btn{background:none;border:none;color:var(--yang);cursor:pointer;font-weight:600;text-decoration:underline;margin-left:5px}

/* Staff Switch Elements */
.staff-box{border:1px dashed var(--staff-border);padding:1rem;border-radius:4px;margin-bottom:1rem;transition:all .2s}
.staff-box.on{border-color:rgba(0,52,120,.5);background:rgba(0,52,120,.08)}
.staff-toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:.75rem}
.staff-lbl{font-size:13px;color:var(--dobok);display:flex;align-items:center;gap:8px;flex:1}
.sw{width:38px;height:20px;background:rgba(255,255,255,.1);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--eum)}
.sw-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dobok);border-radius:50%;transition:transform .2s}
.sw.on .sw-knob{transform:translateX(18px)}

/* --- CLIENT INTERFACE ARCHITECTURE --- */
.client-layout{min-height:100vh;display:flex;flex-direction:column}
.client-header{height:64px;background:var(--dobok);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:40}
.c-nav{display:flex;gap:1.5rem}
.c-nav-btn{background:none;border:none;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:.5rem;transition:color .2s}
.c-nav-btn.active{color:var(--ink);border-bottom:2px solid var(--eum)}
.client-main{flex:1;padding:2.5rem;max-width:1200px;width:100%;margin:0 auto}

/* --- MENU & RANGOS GRID --- */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-top:1.5rem}
.item-card{background:var(--dobok);border:1px solid var(--border);border-radius:4px;padding:1.5rem;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.item-card:hover{transform:translateY(-2px)}
.item-emoji{font-size:32px;margin-bottom:0.5rem}
.item-name{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:700;color:var(--ink)}
.item-desc{font-size:13px;color:var(--muted);margin:.4rem 0 1.2rem;line-height:1.4}
.item-foot{display:flex;align-items:center;justify-content:space-between}
.item-price{font-size:16px;font-weight:600;color:var(--eum)}
.btn-add{padding:.45rem 1rem;background:var(--ink);color:var(--dobok);border:none;border-radius:2px;font-size:11px;font-weight:600;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn-add:hover{background:var(--yang)}

/* Ranks */
.ranks-banner{background:var(--ink);color:var(--dobok);padding:2rem;border-radius:4px;margin-bottom:2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1.5rem}
.rank-badge{padding:.4rem 1.2rem;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* --- TRACKER PERSISTENTE DE PEDIDOS --- */
.order-tracker {
  background: var(--dobok);
  border: 2px solid var(--eum);
  border-radius: 4px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  box-shadow: 0 4px 15px var(--eum-glow);
}
.tracker-hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 1rem;
}
.tracker-title {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--eum);
}
.tracker-steps {
  display: flex;
  justify-content: space-between;
  position: relative;
  max-width: 600px;
  margin: 0 auto;
}
.tracker-steps::before {
  content: '';
  position: absolute;
  top: 14px;
  left: 10%;
  right: 10%;
  height: 2px;
  background: var(--border);
  z-index: 0;
}
.t-step {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--muted-light);
}
.t-icon {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--dobok);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: all 0.3s;
}
.t-step.active .t-icon {
  border-color: var(--eum);
  background: var(--eum);
  color: var(--dobok);
  box-shadow: 0 0 0 4px var(--eum-light);
}
.t-step.done .t-icon {
  border-color: var(--ok);
  background: var(--ok);
  color: var(--dobok);
}
.t-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.t-step.active .t-label { color: var(--eum); }
.t-step.done .t-label { color: var(--ok); }

/* --- CARRITO DRAWER --- */
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100}
.cart-drawer{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--dobok);z-index:101;box-shadow:-6px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;padding:1.5rem}
.cart-hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1rem}
.cart-title{font-family:'Nanum Myeongjo',serif;font-size:20px;font-weight:800}
.btn-close{background:none;border:none;font-size:18px;cursor:pointer}
.cart-items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
.ci{display:flex;align-items:center;gap:12px;padding-bottom:1rem;border-bottom:1px dashed var(--border)}
.ci-em{font-size:24px}
.ci-info{flex:1}
.ci-nm{font-size:14px;font-weight:600}
.ci-pr{font-size:13px;color:var(--muted)}
.ci-qty{display:flex;align-items:center;gap:8px}
.qty-btn{width:22px;height:22px;background:var(--paper);border:none;border-radius:2px;cursor:pointer;font-weight:700}
.btn-rm{background:none;border:none;cursor:pointer;color:var(--yang);margin-left:5px}
.cart-foot{border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem}
.cart-line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:.4rem}
.cart-total-line{display:flex;justify-content:space-between;font-size:18px;font-weight:700;color:var(--yang);margin:.6rem 0}
.btn-checkout{width:100%;padding:.85rem;background:var(--eum);color:var(--dobok);border:none;border-radius:2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer}
.btn-checkout:hover{background:var(--ink)}

/* --- CHECKOUT COMPONENT --- */
.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1.5rem 0}
.pay-box{border:1px solid var(--border);padding:1.2rem;border-radius:4px;text-align:center;cursor:pointer;transition:all .2s;background:var(--dobok)}
.pay-box.active{border-color:var(--yang);background:var(--paper);box-shadow:0 0 0 1px var(--yang)}
.bank-box{background:var(--paper);padding:1.2rem;border-radius:4px;margin-bottom:1rem;font-size:13px}
.bank-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.bank-row:last-child{border-bottom:none}
.drop-z{border:2px dashed var(--muted-light);padding:1.5rem;text-align:center;border-radius:4px;cursor:pointer;background:rgba(0,0,0,.01);font-size:13px;color:var(--muted)}
.drop-z.drag{background:var(--eum-light);border-color:var(--eum)}
.drop-z.uploaded{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}

/* --- MURO DEL DOJANG (COMMENTS) --- */
.wall-form{background:var(--dobok);border:1px solid var(--border);border-radius:4px;padding:1.5rem;margin-bottom:2rem}
.wall-textarea{width:100%;height:90px;padding:.8rem;border:1px solid var(--border);border-radius:2px;background:var(--ivory);font-family:'Inter',sans-serif;font-size:14px;outline:none;resize:none;margin-bottom:.8rem}
.wall-textarea:focus{border-color:var(--eum)}
.comments-list{display:flex;flex-direction:column;gap:1.2rem}
.cmt-card{background:var(--dobok);border:1px solid var(--border);border-radius:4px;padding:1.2rem;position:relative;animation:fIn .3s ease}
.cmt-meta{display:flex;align-items:center;gap:10px;margin-bottom:.6rem;flex-wrap:wrap}
.cmt-author{font-weight:600;font-size:14px}
.cmt-time{font-size:11px;color:var(--muted-light);margin-left:auto}
.cmt-text{font-size:14px;color:var(--ink-soft);line-height:1.6;font-weight:300}

/* --- STAFF DASHBOARD ARCHITECTURE --- */
.staff-shell{min-height:100vh;background:var(--staff-bg);color:var(--dobok);display:flex}
.staff-sidebar{width:260px;background:var(--staff-card);border-right:1px solid var(--staff-border);padding:1.5rem;display:flex;flex-direction:column;justify-content:space-between}
.staff-brand{font-family:'Nanum Myeongjo',serif;font-size:22px;font-weight:800;letter-spacing:1px;margin-bottom:2rem}
.staff-brand span{color:var(--yang)}
.staff-nav{display:flex;flex-direction:column;gap:.5rem;flex:1}
.staff-nav-btn{width:100%;text-align:left;background:none;border:none;padding:.75rem 1rem;color:var(--muted-light);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;border-radius:2px;transition:all .2s}
.staff-nav-btn:hover,.staff-nav-btn.active{background:rgba(255,255,255,.04);color:var(--dobok)}
.staff-nav-btn.active{border-left:3px solid var(--yang)}
.staff-content{flex:1;padding:2.5rem;overflow-y:auto}
.staff-title{font-family:'Nanum Myeongjo',serif;font-size:28px;font-weight:800;margin-bottom:1.5rem;border-bottom:1px solid var(--staff-border);padding-bottom:.5rem}
.staff-table{width:100%;border-collapse:collapse;margin-top:1rem;text-align:left}
.staff-table th{padding:1rem;font-size:11px;text-transform:uppercase;color:var(--muted-light);border-bottom:1px solid var(--staff-border);letter-spacing:1px}
.staff-table td{padding:1.2rem 1rem;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);color:rgba(255,255,255,.85)}
.staff-table tr:hover td{background:rgba(255,255,255,.01)}
.s-status{padding:2px 8px;border-radius:2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:inline-block}
.s-status.recibido{background:rgba(182,122,26,.15);color:var(--warn)}
.s-status.preparacion{background:rgba(0,52,120,.2);color:#5b93e3}
.s-status.listo{background:var(--ok-bg);color:var(--ok)}
.s-btn{padding:.35rem .75rem;border:none;border-radius:2px;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;margin-right:5px;transition:opacity .15s}
.s-btn:hover{opacity:.85}
.s-btn.accept{background:var(--ok);color:var(--dobok)}
.s-btn.next{background:var(--eum);color:var(--dobok)}

/* --- TOAST NOTIFICATIONS --- */
.toast-wrap{position:fixed;top:1.5rem;right:1.5rem;z-index:600;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:var(--ink);color:var(--dobok);padding:1rem 1.4rem;border-radius:3px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tIn .25s ease;display:flex;align-items:center;gap:12px;min-width:280px;pointer-events:all;border-left:4px solid var(--muted)}
.toast.t-yang{border-left-color:var(--yang)}
.toast.t-eum{border-left-color:var(--eum)}
.toast.t-ok{border-left-color:var(--ok)}

/* --- ANIMATIONS --- */
@keyframes tIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.err-msg{background:rgba(205,46,58,.1);border-left:3px solid var(--yang);color:#ff5c65;padding:.75rem 1rem;font-size:13px;border-radius:2px;margin-bottom:1rem}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--muted-light);font-size:14px;letter-spacing:1px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--dobok);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div id="root"></div>

/* --- LATERAL CART DRAWER --- */
function CartDrawer({carrito,onClose,onUpdate,onRemove,onCheckout}){
  const sub = carrito.reduce((s,x)=>s+x.precio*x.qty,0);
  const iva = sub * IVA;
  const total = sub + iva;
  const pts = Math.round(total * PTS_PER_DOLLAR);

  return (
    <>
      <div className="cart-overlay" onClick={onClose}></div>
      <div className="cart-drawer">
        <div className="cart-hd">
          <div className="cart-title">🛒 Mi Pedido</div>
          <button className="btn-close" onClick={onClose}>✕</button>
        </div>
        <div className="cart-items">
          {carrito.length === 0 ? (
            <div style={{textAlign:"center",padding:"4rem 0",color:"var(--muted)"}}>El carrito está vacío.</div>
          ) : (
            carrito.map(x=>(
              <div className="ci" key={x.id}>
                <div className="ci-em">{x.emoji}</div>
                <div className="ci-info">
                  <div className="ci-nm">{x.nombre}</div>
                  <div className="ci-pr">${(x.precio*x.qty).toFixed(2)}</div>
                </div>
                <div className="ci-qty">
                  <button className="qty-btn" onClick={()=>onUpdate(x.id,-1)}>−</button>
                  <span>{x.qty}</span>
                  <button className="qty-btn" onClick={()=>onUpdate(x.id,1)}>+</button>
                  <button className="btn-rm" onClick={()=>onRemove(x.id)}>🗑</button>
                </div>
              </div>
            ))
          )}
        </div>
        {carrito.length > 0 && (
          <div className="cart-foot">
            <div className="cart-line"><span>Subtotal</span><span>${sub.toFixed(2)}</span></div>
            <div className="cart-line"><span>IVA (12%)</span><span>${iva.toFixed(2)}</span></div>
            <div className="cart-total-line"><span>Total</span><span>${total.toFixed(2)}</span></div>
            <div style={{fontSize:11,color:"var(--gold)",marginBottom:15,fontWeight:600}}>🥋 Ganarás +{pts.toLocaleString()} puntos</div>
            <button className="btn-checkout" onClick={()=>onCheckout({sub,iva,total,pts})}>Proceder al Pago →</button>
          </div>
        )}
      </div>
    </>
  );
}

/* --- CLIENT DASHBOARD COMPONENT --- */
function ClientDashboard({user,addToast,globalPedidos,onAddPedido}){
  const meta = user.user_metadata || {};
  const nombre = meta.nombre_completo || user.email;
  const [vista,setVista]=useState("menu");
  const [carrito,setCarrito]=useState([]);
  const [openCart,setOpenCart]=useState(false);
  const [checkoutResumen,setCheckoutResumen]=useState(null);

  const [comentarios,setComentarios]=useState([]);
  const [nuevoComentario,setNuevoComentario]=useState("");

  useEffect(()=>{
    const cached = localStorage.getItem(LS_KEY);
    if(cached) setComentarios(JSON.parse(cached));
    else {
      const iniciales = [
        {id:1,autor:"Sabonim Kim",texto:"Bienvenidos al Dojang. Recuerden entrenar con perseverancia. La cortesía es nuestro primer pilar.",fecha:"Hace 2 horas"},
        {id:2,autor:"Aspirante",texto:"El Jeju Volcanic Latte tiene el balance perfecto de dulzura y potencia, ideal antes del entrenamiento.",fecha:"Hace 30 mins"}
      ];
      setComentarios(iniciales);
      localStorage.setItem(LS_KEY,JSON.stringify(iniciales));
    }
  }, []);

  const handleAddComment = (e)=>{
    e.preventDefault();
    if(!nuevoComentario.trim()) return;
    const cmt = { id: Date.now(), autor: nombre.split(" ")[0], texto: nuevoComentario, fecha: "Ahora mismo" };
    const actualizados = [cmt, ...comentarios];
    setComentarios(actualizados);
    localStorage.setItem(LS_KEY,JSON.stringify(actualizados));
    setNuevoComentario("");
    addToast("Comentario publicado en el muro del Dojang","ok","🥋");
  };

  const misPedidos = globalPedidos.filter(p=>p.userId===user.id);
  const puntosTotales = misPedidos.reduce((acc,p)=>acc+p.puntos,0);
  const cinturonActual = getBelt(puntosTotales);
  const proximoCinturon = getNextBelt(puntosTotales);
  
  // Extraemos el pedido más reciente para mostrarlo en el Tracker
  const pedidoActivo = misPedidos.length > 0 ? misPedidos[0] : null;

  // Lógica para determinar el progreso visual
  const getStepStatus = (stepName, currentStatus) => {
    const states = ["recibido", "preparacion", "listo"];
    const stepIdx = states.indexOf(stepName);
    const currIdx = states.indexOf(currentStatus);
    if (stepIdx < currIdx) return "done";
    if (stepIdx === currIdx) return "active";
    return "";
  };

  const handleAddToCart = (item)=>{
    setCarrito(prev=>{
      const ex = prev.find(x=>x.id===item.id);
      if(ex) return prev.map(x=>x.id===item.id?{...x,qty:x.qty+1}:x);
      return [...prev,{...item,qty:1}];
    });
    addToast(`${item.nombre} añadido al pedido`,"eum","☕");
  };

  const handleUpdateQty = (id,delta)=> setCarrito(prev=>prev.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+delta)}:x));
  const handleRemove = (id)=> setCarrito(prev=>prev.filter(x=>x.id!==id));
  const handleCheckoutInit = (resumen)=>{ setCheckoutResumen(resumen); setOpenCart(false); setVista("checkout"); };

  const handleConfirmarPago = (metodo)=>{
    const nuevoPedido = {
      id: `#KO-${Math.floor(1000+Math.random()*9000)}`,
      userId: user.id,
      cliente: nombre,
      items: carrito.map(x=>`${x.qty}x ${x.nombre}`).join(", "),
      total: checkoutResumen.total,
      puntos: checkoutResumen.pts,
      metodo: metodo==="card"?"Tarjeta":"Transferencia",
      estado: "recibido"
    };
    onAddPedido(nuevoPedido);
    setCarrito([]);
    setVista("menu"); // Regresa al menú para poder ver el Tracker en la parte superior
    addToast("¡Pedido recibido en el KDS del Dojang!","ok","🔥");
  };

  return (
    <div className="client-layout">
      <header className="client-header">
        <div className="land-logo">
          <div className="land-logo-main" style={{color:"var(--ink)"}}>KO<span>-ffee</span></div>
        </div>
        <nav className="c-nav">
          <button className={`c-nav-btn ${vista==="menu"?"active":""}`} onClick={()=>setVista("menu")}>🥋 Menú & Reservas</button>
          <button className={`c-nav-btn ${vista==="pedidos"?"active":""}`} onClick={()=>setVista("pedidos")}>📋 Mis Órdenes ({misPedidos.length})</button>
          <button className={`c-nav-btn ${vista==="muro"?"active":""}`} onClick={()=>setVista("muro")}>⛩️ Muro Dojang</button>
        </nav>
        <div style={{display:"flex",alignItems:"center",gap:15}}>
          <button style={{background:"none",border:"none",fontSize:20,cursor:"pointer",position:"relative"}} onClick={()=>setOpenCart(true)}>
            🛒 {carrito.length>0 && <span style={{position:"absolute",top:-5,right:-5,background:"var(--yang)",color:"white",fontSize:10,borderRadius:"50%",padding:"2px 6px"}}>{carrito.reduce((s,x)=>s+x.qty,0)}</span>}
          </button>
          <button className="btn-nav-login" style={{background:"var(--ink)"}} onClick={()=>sb.auth.signOut()}>Salir</button>
        </div>
      </header>

      <main className="client-main">
        {/* --- TRACKER PERSISTENTE DE ORDEN --- */}
        {pedidoActivo && vista !== "checkout" && (
          <div className="order-tracker">
            <div className="tracker-hd">
              <div className="tracker-title">Estado de Orden {pedidoActivo.id}</div>
              <div style={{fontSize:12,color:"var(--muted)",fontWeight:600}}>Total: ${pedidoActivo.total.toFixed(2)}</div>
            </div>
            <div className="tracker-steps">
              <div className={`t-step ${getStepStatus("recibido", pedidoActivo.estado)}`}>
                <div className="t-icon">1</div><div className="t-label">Recibido</div>
              </div>
              <div className={`t-step ${getStepStatus("preparacion", pedidoActivo.estado)}`}>
                <div className="t-icon">2</div><div className="t-label">En Preparación</div>
              </div>
              <div className={`t-step ${getStepStatus("listo", pedidoActivo.estado)}`}>
                <div className="t-icon">3</div><div className="t-label">Listo para Retirar</div>
              </div>
            </div>
            {pedidoActivo.estado === "listo" && (
               <div style={{textAlign:"center",marginTop:20,fontSize:13,color:"var(--ok)",fontWeight:600,paddingTop:15,borderTop:"1px dashed var(--border)"}}>
                 ¡Tu orden está lista! Por favor, acércate a la barra y déjanos tus comentarios en el Muro del Dojang.
               </div>
            )}
          </div>
        )}

        <div className="ranks-banner">
          <div>
            <div style={{fontSize:11,textTransform:"uppercase",color:"var(--muted-light)",letterSpacing:1}}>Rango Actual</div>
            <h3 className="myeongjo" style={{fontSize:22,fontWeight:800}}>Guerrero del Dojo: {nombre}</h3>
          </div>
          <div style={{textAlign:"right"}}>
            <span className="rank-badge" style={{background:cinturonActual.color,color:cinturonActual.text,border:`1px solid ${cinturonActual.border}`}}>
              Cinturón {cinturonActual.en} · {cinturonActual.ko}
            </span>
            <div style={{fontSize:12,marginTop:6,color:"var(--muted-light)"}}>
              {proximoCinturon ? `Te faltan ${(proximoCinturon.min - puntosTotales).toLocaleString()} pts para Cinturón ${proximoCinturon.en}` : "¡Has alcanzado el grado máximo de Maestría! 🏆"}
            </div>
          </div>
        </div>

        {vista === "menu" && (
          <div>
            <h2 className="myeongjo" style={{fontSize:24}}>Menú del Dojang</h2>
            <p style={{fontSize:13,color:"var(--muted)"}}>Sujeto a acumulación automática de 100 puntos por cada $1.</p>
            <div className="menu-grid">
              {MENU.map(item=>(
                <div className="item-card" key={item.id}>
                  <div>
                    <div className="item-emoji">{item.emoji}</div>
                    <div className="item-name">{item.nombre}</div>
                    <div className="item-desc">{item.desc}</div>
                  </div>
                  <div className="item-foot">
                    <span className="item-price">${item.precio.toFixed(2)}</span>
                    <button className="btn-add" onClick={()=>handleAddToCart(item)}>Añadir</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {vista === "checkout" && (
          <CheckoutPage resumen={checkoutResumen} onConfirm={handleConfirmarPago} onBack={()=>setVista("menu")}/>
        )}

        {vista === "pedidos" && (
          <div>
            <h2 className="myeongjo" style={{fontSize:24,marginBottom:15}}>Historial de Poomsaes (Órdenes)</h2>
            {misPedidos.length === 0 ? (
              <p style={{color:"var(--muted)",fontSize:14}}>No has realizado pedidos aún.</p>
            ) : (
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {misPedidos.map(p=>(
                  <div key={p.id} style={{background:"var(--dobok)",border:"1px solid var(--border)",padding:"1.2rem",borderRadius:4,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <strong>{p.id}</strong> <span style={{marginLeft:10,fontSize:13,color:"var(--muted)"}}>{p.items}</span>
                      <div style={{fontSize:11,color:"var(--gold)",marginTop:4}}>🥋 Acumuló +{p.puntos} puntos</div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <span className={`s-status ${p.estado}`}>{p.estado}</span>
                      <div style={{fontSize:14,fontWeight:600,marginTop:5}}>${p.total.toFixed(2)}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {vista === "muro" && (
          <div>
            <h2 className="myeongjo" style={{fontSize:24,marginBottom:5}}>Muro del Dojang</h2>
            <p style={{fontSize:13,color:"var(--muted)",marginBottom:20}}>Espacio de intercomunicación libre y abierto para la comunidad.</p>
            
            <form className="wall-form" onSubmit={handleAddComment}>
              <textarea className="wall-textarea" placeholder="Escribe tu observación o saludo al Sabonim..." value={nuevoComentario} onChange={e=>setNuevoComentario(e.target.value)} required></textarea>
              <button className="btn-yang" style={{width:"auto",padding:".6rem 2rem"}} type="submit">Publicar Mensaje</button>
            </form>

            <div className="comments-list">
              {comentarios.map(c=>(
                <div className="cmt-card" key={c.id}>
                  <div className="cmt-meta">
                    <span className="cmt-author">🥋 {c.autor}</span>
                    <span className="cmt-time">{c.fecha}</span>
                  </div>
                  <div className="cmt-text">{c.texto}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>

      {openCart && <CartDrawer carrito={carrito} onClose={()=>setOpenCart(false)} onUpdate={handleUpdateQty} onRemove={handleRemove} onCheckout={handleCheckoutInit}/>}
    </div>
  );
}

/* --- STAFF DASHBOARD COMPONENT (KDS OPERATIVO) --- */
function StaffDashboard({globalPedidos,onUpdatePedido}){
  return (
    <div className="staff-shell">
      <aside className="staff-sidebar">
        <div>
          <div className="staff-brand">KO<span>-ffee</span> Staff</div>
          <nav className="staff-nav">
            <button className="staff-nav-btn active">⚔️ Monitor KDS</button>
          </nav>
        </div>
        <button className="staff-nav-btn" onClick={()=>sb.auth.signOut()}>Cerrar Sesión</button>
      </aside>

      <main className="staff-content">
        <h2 className="staff-title">Kitchen Display System (KDS)</h2>
        <p style={{fontSize:13,color:"var(--muted-light)",marginTop:-10,marginBottom:20}}>Panel operativo en tiempo real para el despacho de insumos.</p>
        
        {globalPedidos.length === 0 ? (
          <p style={{color:"var(--muted-light)"}}>No existen órdenes pendientes en la cola del Dojo.</p>
        ) : (
          <table className="staff-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Ítems Pedidos</th>
                <th>Total</th>
                <th>Método</th>
                <th>Estado</th>
                <th>Acciones de Despacho</th>
              </tr>
            </thead>
            <tbody>
              {globalPedidos.map(p=>(
                <tr key={p.id}>
                  <td><strong>{p.id}</strong></td>
                  <td>{p.cliente}</td>
                  <td>{p.items}</td>
                  <td>${p.total.toFixed(2)}</td>
                  <td><span style={{fontSize:11,opacity:0.7}}>{p.metodo}</span></td>
                  <td><span className={`s-status ${p.estado}`}>{p.estado}</span></td>
                  <td>
                    {p.estado === "recibido" && (
                      <button className="s-btn accept" onClick={()=>onUpdatePedido(p.id,"preparacion")}>Preparar</button>
                    )}
                    {p.estado === "preparacion" && (
                      <button className="s-btn next" onClick={()=>onUpdatePedido(p.id,"listo")}>Listo para Entrega</button>
                    )}
                    {p.estado === "listo" && (
                      <span style={{color:"var(--ok)",fontSize:12,fontWeight:600}}>✓ Completado</span>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </main>
    </div>
  );
}

/* --- ORQUESTADOR PRINCIPAL (APP CENTRAL) --- */
function App(){
  const [session,setSession]=useState(null);
  const [loading,setLoading]=useState(true);
  const [screen,setScreen]=useState("landing"); // landing, login, register, app
  const [toasts,setToasts]=useState([]);
  
  // State Centralizado de Pedidos para sincronización inmediata
  const [globalPedidos,setGlobalPedidos]=useState([
    {id:"#KO-7711",userId:"demo-1",cliente:"Carlos Mendoza",items:"1x Cold Brew Nitro, 1x Croissant",total:11.42,puntos:1142,metodo:"Tarjeta",estado:"listo"}
  ]);

  const addToast = (msg,type="yang",icon="🥋")=>{
    const id = Date.now();
    setToasts(prev=>[...prev,{id,msg,type,icon}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),4000);
  };

  useEffect(()=>{
    // Sincronizar estado de sesión de Supabase
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session) setScreen("app");
      setLoading(false);
    });

    const {data:{subscription}}=sb.auth.onAuthStateChange((_event,session)=>{
      setSession(session);
      if(session) setScreen("app");
      else setScreen("landing");
    });

    return () => subscription.unsubscribe();
  },[]);

  const handleAddPedido = (p) => {
    setGlobalPedidos(prev=>[p, ...prev]);
  };
  
  const handleUpdatePedido = (id,nuevoEstado) => {
    setGlobalPedidos(prev=>prev.map(p=>p.id===id?{...p,estado:nuevoEstado}:p));
    addToast(`Orden ${id} modificada a ${nuevoEstado}`,"eum","📋");
  };

  if(loading) return <div className="loading-screen"><span className="spinner" style={{marginRight:10}}></span> Cargando credenciales del Dojo…</div>;

  return (
    <>
      <ToastContainer toasts={toasts}/>
      {screen === "landing"  && <LandingPage onGoLogin={()=>setScreen("login")}/>}
      {screen === "login"    && <LoginForm onSwitch={()=>setScreen("register")}/>}
      {screen === "register" && <RegisterForm onSwitch={()=>setScreen("login")}/>}
      {screen === "app" && session && (
        session.user?.user_metadata?.is_staff ? (
          <StaffDashboard globalPedidos={globalPedidos} onUpdatePedido={handleUpdatePedido}/>
        ) : (
          <ClientDashboard user={session.user} addToast={addToast} globalPedidos={globalPedidos} onAddPedido={handleAddPedido}/>
        )
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
