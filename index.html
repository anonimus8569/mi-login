<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Empresa Corp.</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,300;0,500;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f0ede6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: #f0ede6;
      position: relative;
      overflow: hidden;
    }

    .page::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: #d6cfc2;
      opacity: 0.4;
      pointer-events: none;
    }

    .page::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -15%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: #c8bfaf;
      opacity: 0.3;
      pointer-events: none;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem 2.75rem;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(0,0,0,0.07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: #1a1a1a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 500;
      color: #1a1a1a;
      letter-spacing: -0.3px;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 26px;
      font-weight: 300;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 0.35rem;
    }

    .card-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 1.75rem;
      font-weight: 300;
    }

    .form-group { margin-bottom: 1rem; }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .form-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid #e8e3dd;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #1a1a1a;
      background: #faf9f7;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .form-input:focus { border-color: #1a1a1a; background: #fff; }
    .form-input::placeholder { color: #bbb; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: #1a1a1a;
      color: #f0ede6;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    .btn-primary:hover { background: #333; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.25rem 0;
      color: #ccc;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8e3dd;
    }

    .link-row {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 1rem;
    }

    .link-btn {
      background: none;
      border: none;
      color: #1a1a1a;
      font-weight: 500;
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 1rem;
    }

    .alert-error { background: #fef2f2; color: #c0392b; border: 1px solid #fbd5d5; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-family: 'Fraunces', serif;
      font-size: 26px;
      color: #f0ede6;
      font-weight: 300;
    }

    .welcome-title {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 300;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .welcome-meta {
      font-size: 13px;
      color: #999;
      margin-bottom: 2rem;
      text-align: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .info-card {
      background: #faf9f7;
      border: 1px solid #e8e3dd;
      border-radius: 12px;
      padding: 0.9rem 1rem;
    }

    .info-card-label {
      font-size: 11px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .info-card-value {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-logout {
      display: block;
      margin: 0 auto;
      background: none;
      border: 1.5px solid #e8e3dd;
      border-radius: 10px;
      padding: 0.65rem 1.5rem;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: #1a1a1a; color: #1a1a1a; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Supabase ──────────────────────────────────────────────────────────────
    const { createClient } = supabase;
    const supabaseClient = createClient(
      "https://skllslblccxvduaqejfs.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbGxzbGJsY2N4dmR1YXFlamZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDQ3OTAsImV4cCI6MjA5NjUyMDc5MH0.ztGkc572MXH8qQK0hruAUXN64hXMuU4maPgSi2Dg6WQ"
    );

    // ── Ícono de casa ─────────────────────────────────────────────────────────
    const HomeIcon = () => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="#f0ede6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    );

    const Brand = () => (
      <div className="brand">
        <div className="brand-icon"><HomeIcon /></div>
        <span className="brand-name">Empresa Corp.</span>
      </div>
    );

    // ── Login ─────────────────────────────────────────────────────────────────
    function LoginForm({ onSwitch }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");

      const handleLogin = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) setError(error.message);
        setLoading(false);
      };

      return (
        <div className="card">
          <Brand />
          <h1 className="card-title">Bienvenido de nuevo</h1>
          <p className="card-subtitle">Ingresa tus credenciales para continuar</p>
          {error && <div className="alert alert-error">{error}</div>}
          <form onSubmit={handleLogin}>
            <div className="form-group">
              <label className="form-label">Correo electrónico</label>
              <input className="form-input" type="email" placeholder="tu@empresa.com"
                value={email} onChange={e => setEmail(e.target.value)} required />
            </div>
            <div className="form-group">
              <label className="form-label">Contraseña</label>
              <input className="form-input" type="password" placeholder="••••••••"
                value={password} onChange={e => setPassword(e.target.value)} required />
            </div>
            <button className="btn-primary" type="submit" disabled={loading}>
              {loading && <span className="spinner" />}
              {loading ? "Ingresando..." : "Iniciar sesión"}
            </button>
          </form>
          <div className="divider">o</div>
          <div className="link-row">
            ¿No tienes cuenta?{" "}
            <button className="link-btn" onClick={onSwitch}>Regístrate aquí</button>
          </div>
        </div>
      );
    }

    // ── Registro ──────────────────────────────────────────────────────────────
    function RegisterForm({ onSwitch }) {
      const [form, setForm] = useState({ nombre: "", email: "", empresa: "", telefono: "", password: "" });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState("");
      const [success, setSuccess] = useState(false);

      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

      const handleRegister = async (e) => {
        e.preventDefault();
        setError("");
        setLoading(true);
        const { error } = await supabaseClient.auth.signUp({
          email: form.email,
          password: form.password,
          options: {
            data: {
              nombre_completo: form.nombre,
              empresa: form.empresa,
              telefono: form.telefono,
            }
          }
        });
        if (error) setError(error.message);
        else setSuccess(true);
        setLoading(false);
      };

      if (success) return (
        <div className="card" style={{ textAlign: "center" }}>
          <div style={{ fontSize: 48, marginBottom: "1rem" }}>✉️</div>
          <h2 className="card-title">Revisa tu correo</h2>
          <p className="card-subtitle" style={{ marginBottom: "1.5rem" }}>
            Enviamos un enlace de confirmación a <strong>{form.email}</strong>.<br />
            Confírmalo para activar tu cuenta.
          </p>
          <button className="link-btn" onClick={onSwitch}>Volver al inicio de sesión</button>
        </div>
      );

      return (
        <div className="card">
          <Brand />
          <h1 className="card-title">Crear cuenta</h1>
          <p className="card-subtitle">Completa tus datos para registrarte</p>
          {error && <div className="alert alert-error">{error}</div>}
          <form onSubmit={handleRegister}>
            <div className="form-group">
              <label className="form-label">Nombre completo</label>
              <input className="form-input" type="text" placeholder="Juan Pérez"
                value={form.nombre} onChange={set("nombre")} required />
            </div>
            <div className="form-row">
              <div className="form-group">
                <label className="form-label">Empresa / Área</label>
                <input className="form-input" type="text" placeholder="Ventas"
                  value={form.empresa} onChange={set("empresa")} required />
              </div>
              <div className="form-group">
                <label className="form-label">Teléfono</label>
                <input className="form-input" type="tel" placeholder="+593 9..."
                  value={form.telefono} onChange={set("telefono")} />
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Correo electrónico</label>
              <input className="form-input" type="email" placeholder="tu@empresa.com"
                value={form.email} onChange={set("email")} required />
            </div>
            <div className="form-group">
              <label className="form-label">Contraseña</label>
              <input className="form-input" type="password" placeholder="Mínimo 6 caracteres"
                value={form.password} onChange={set("password")} minLength={6} required />
            </div>
            <button className="btn-primary" type="submit" disabled={loading}>
              {loading && <span className="spinner" />}
              {loading ? "Registrando..." : "Crear cuenta"}
            </button>
          </form>
          <div className="divider">o</div>
          <div className="link-row">
            ¿Ya tienes cuenta?{" "}
            <button className="link-btn" onClick={onSwitch}>Inicia sesión</button>
          </div>
        </div>
      );
    }

    // ── Bienvenida ────────────────────────────────────────────────────────────
    function WelcomeScreen({ user }) {
      const meta = user.user_metadata || {};
      const nombre = meta.nombre_completo || user.email;
      const initials = nombre.split(" ").map(n => n[0]).slice(0, 2).join("").toUpperCase();

      const formatDate = (iso) => {
        if (!iso) return "—";
        return new Date(iso).toLocaleDateString("es-EC", { day: "2-digit", month: "long", year: "numeric" });
      };

      return (
        <div className="card">
          <div className="avatar">{initials}</div>
          <h1 className="welcome-title">
            ¡Hola, <em>{nombre.split(" ")[0]}</em>!
          </h1>
          <p className="welcome-meta">Has iniciado sesión correctamente</p>
          <div className="info-grid">
            <div className="info-card">
              <div className="info-card-label">Correo</div>
              <div className="info-card-value">{user.email}</div>
            </div>
            <div className="info-card">
              <div className="info-card-label">Empresa / Área</div>
              <div className="info-card-value">{meta.empresa || "—"}</div>
            </div>
            <div className="info-card">
              <div className="info-card-label">Teléfono</div>
              <div className="info-card-value">{meta.telefono || "—"}</div>
            </div>
            <div className="info-card">
              <div className="info-card-label">Miembro desde</div>
              <div className="info-card-value">{formatDate(user.created_at)}</div>
            </div>
          </div>
          <button className="btn-logout" onClick={() => supabaseClient.auth.signOut()}>
            Cerrar sesión
          </button>
        </div>
      );
    }

    // ── App principal ─────────────────────────────────────────────────────────
    function App() {
      const [session, setSession] = useState(null);
      const [view, setView] = useState("login");
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setLoading(false);
        });
        const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });
        return () => subscription.unsubscribe();
      }, []);

      if (loading) return (
        <div className="page">
          <p style={{ color: "#aaa", fontFamily: "'DM Sans', sans-serif", fontSize: 14 }}>Cargando...</p>
        </div>
      );

      return (
        <div className="page">
          {session
            ? <WelcomeScreen user={session.user} />
            : view === "login"
              ? <LoginForm onSwitch={() => setView("register")} />
              : <RegisterForm onSwitch={() => setView("login")} />
          }
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
