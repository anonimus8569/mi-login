<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KO-ffee — Specialty Coffee & Dojo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --obsidian:#0d0d0d;
  --ink:#1a1a1a;
  --graphite:#2a2a2a;
  --steel:#3d3d3d;
  --linen:#f5f2ed;
  --bone:#ece8e1;
  --mist:#d4cfc8;
  --muted:#8a8480;
  --crimson:#c0162c;
  --crimson-dark:#8b0e1f;
  --crimson-glow:rgba(192,22,44,0.15);
  --white:#ffffff;
  --gold:#b8952a;
  --green:#2d6a4f;
  --border:#2f2f2f;
  --border-light:#e0dbd4;
}
body{font-family:'Inter',sans-serif;background:var(--linen);color:var(--ink);min-height:100vh}
h1,h2,h3,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.serif{font-family:'Noto Serif JP',serif}

/* ════════════════════════════════════
   LANDING PAGE
════════════════════════════════════ */
.landing{background:var(--obsidian);min-height:100vh;color:var(--white)}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(192,22,44,0.12) 0%,transparent 70%)}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero-kanji{font-family:'Noto Serif JP',serif;font-size:120px;font-weight:300;color:rgba(255,255,255,0.04);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;line-height:1;white-space:nowrap}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(192,22,44,0.4);border-radius:2px;padding:5px 14px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--crimson);margin-bottom:1.5rem}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(72px,12vw,130px);letter-spacing:4px;line-height:0.9;margin-bottom:1rem;position:relative;z-index:1}
.hero-title span{color:var(--crimson)}
.hero-sub{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem;font-weight:300}
.hero-cta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn-hero{padding:0.85rem 2.5rem;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:2px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif}
.btn-hero-primary{background:var(--crimson);color:var(--white)}
.btn-hero-primary:hover{background:var(--crimson-dark)}
.btn-hero-outline{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,0.2)}
.btn-hero-outline:hover{border-color:var(--white);background:rgba(255,255,255,0.05)}

/* nav landing */
.land-nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:1.25rem 3rem;display:flex;align-items:center;justify-content:space-between;background:rgba(13,13,13,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.land-nav-brand{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--white)}
.land-nav-brand span{color:var(--crimson)}
.land-nav-links{display:flex;gap:2rem}
.land-nav-links a{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-decoration:none;cursor:pointer;transition:color 0.2s}
.land-nav-links a:hover{color:var(--white)}
.btn-nav-login{padding:0.5rem 1.5rem;background:var(--crimson);color:var(--white);border:none;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.2s}
.btn-nav-login:hover{background:var(--crimson-dark)}

/* sections landing */
.land-section{padding:6rem 3rem;max-width:1200px;margin:0 auto}
.section-eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--crimson);margin-bottom:1rem}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,5vw,68px);letter-spacing:2px;line-height:0.95;margin-bottom:1.5rem;color:var(--white)}
.section-body{font-size:15px;color:var(--muted);font-weight:300;line-height:1.8;max-width:560px}

/* belt levels */
.belts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-top:2.5rem}
.belt-card{border:1px solid var(--border);border-radius:4px;padding:1.25rem;background:var(--graphite);text-align:center;transition:border-color 0.2s}
.belt-card:hover{border-color:var(--crimson)}
.belt-icon{font-size:28px;margin-bottom:8px}
.belt-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--white)}
.belt-pts{font-size:11px;color:var(--muted);margin-top:4px}
.belt-reward{font-size:11px;color:var(--crimson);margin-top:6px;font-weight:500}

/* info section */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
@media(max-width:768px){.info-grid{grid-template-columns:1fr}}
.info-block{margin-bottom:2rem}
.info-block-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--crimson);margin-bottom:0.5rem}
.info-block-value{font-size:15px;color:var(--white);font-weight:300;line-height:1.7}
.map-placeholder{background:var(--graphite);border:1px solid var(--border);border-radius:4px;height:260px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.75rem;color:var(--muted)}
.map-ph-icon{font-size:36px;opacity:0.4}
.map-ph-text{font-size:13px;letter-spacing:1px}
.hours-row{display:flex;justify-content:space-between;padding:0.6rem 0;border-bottom:1px solid var(--border);font-size:14px}
.hours-row:last-child{border-bottom:none}
.hours-day{color:var(--muted);font-weight:300}
.hours-time{color:var(--white);font-weight:400}
.social-links{display:flex;gap:1rem;margin-top:1.5rem}
.social-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:border-color 0.2s;text-decoration:none}
.social-btn:hover{border-color:var(--crimson)}

/* divider */
.land-divider{border:none;border-top:1px solid var(--border);margin:0 3rem}

/* ════════════════════════════════════
   AUTH
════════════════════════════════════ */
.auth-page{min-height:100vh;display:flex;background:var(--obsidian)}
.auth-left{display:none;width:45%;background:var(--graphite);border-right:1px solid var(--border);flex-direction:column;justify-content:center;align-items:center;padding:3rem;text-align:center;position:relative;overflow:hidden}
@media(min-width:900px){.auth-left{display:flex}}
.auth-bg-kanji{font-family:'Noto Serif JP',serif;font-size:200px;font-weight:300;color:rgba(255,255,255,0.025);position:absolute;line-height:1;user-select:none}
.auth-quote{font-family:'Noto Serif JP',serif;font-size:20px;font-style:italic;color:rgba(255,255,255,0.6);line-height:1.6;position:relative;z-index:1;margin-bottom:1rem}
.auth-quote-attr{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.auth-card{background:var(--graphite);border:1px solid var(--border);border-radius:4px;padding:2.5rem 2.75rem;width:100%;max-width:420px;position:relative}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--crimson);border-radius:4px 4px 0 0}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.auth-brand-icon{width:38px;height:38px;background:var(--crimson);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px}
.auth-brand-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white)}
.auth-brand-name span{color:var(--crimson)}
.auth-brand-tag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--white);margin-bottom:0.25rem}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;font-weight:300}
.form-group{margin-bottom:0.9rem}
.form-label{display:block;font-size:10px;font-weight:500;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:0.35rem}
.form-input{width:100%;padding:0.65rem 0.85rem;border:1px solid var(--border);border-radius:3px;font-size:14px;font-family:'Inter',sans-serif;font-weight:300;color:var(--white);background:var(--steel);outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:var(--crimson)}
.form-input::placeholder{color:#555}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.btn-primary{width:100%;padding:0.8rem;background:var(--crimson);color:var(--white);border:none;border-radius:3px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:0.5rem;transition:background 0.2s,transform 0.1s}
.btn-primary:hover{background:var(--crimson-dark)}
.btn-primary:active{transform:scale(0.99)}
.btn-primary:disabled{background:#444;cursor:not-allowed;color:#777}
.link-row{text-align:center;font-size:13px;color:var(--muted);margin-top:1.25rem;font-weight:300}
.link-btn{background:none;border:none;color:var(--crimson);font-weight:500;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;text-decoration:underline;text-underline-offset:2px}
.alert{padding:0.7rem 0.9rem;border-radius:3px;font-size:13px;margin-bottom:1rem;font-weight:300}
.alert-error{background:rgba(192,22,44,0.15);color:#ff6b7a;border-left:3px solid var(--crimson)}
.alert-success{background:rgba(45,106,79,0.15);color:#6fcf97;border-left:3px solid var(--green)}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.2);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* staff toggle */
.staff-toggle{border:1px solid var(--border);border-radius:3px;padding:0.85rem 1rem;background:var(--steel);margin-bottom:0.9rem;transition:border-color 0.2s}
.staff-toggle.active{border-color:var(--crimson);background:rgba(192,22,44,0.08)}
.staff-toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.staff-toggle-label{font-size:13px;color:var(--white);font-weight:400;display:flex;align-items:center;gap:8px}
.staff-toggle-icon{font-size:16px}
.toggle-switch{width:38px;height:20px;background:var(--border);border-radius:10px;position:relative;transition:background 0.2s;flex-shrink:0}
.toggle-switch.on{background:var(--crimson)}
.toggle-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--white);border-radius:50%;transition:transform 0.2s}
.toggle-switch.on .toggle-knob{transform:translateX(18px)}
.staff-code-wrap{margin-top:0.75rem;overflow:hidden}

/* ════════════════════════════════════
   APP SHELL (DASHBOARD)
════════════════════════════════════ */
.app-shell{display:flex;min-height:100vh;background:var(--linen)}
.sidebar{width:230px;flex-shrink:0;background:var(--obsidian);display:flex;flex-direction:column;padding:0;position:fixed;top:0;left:0;height:100vh;z-index:20;border-right:1px solid var(--border)}
.sb-brand{padding:1.5rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-brand-icon{width:34px;height:34px;background:var(--crimson);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-brand-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--white)}
.sb-brand-name span{color:var(--crimson)}
.sb-nav{flex:1;padding:1rem 0.75rem;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#444;padding:0.75rem 0.85rem 0.35rem;font-weight:500}
.nav-btn{display:flex;align-items:center;gap:10px;padding:0.6rem 0.85rem;border-radius:3px;font-size:13px;font-weight:400;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.15s;border:none;background:none;font-family:'Inter',sans-serif;width:100%;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8)}
.nav-btn.active{background:rgba(192,22,44,0.15);color:var(--crimson)}
.nav-btn .nb-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-footer{padding:1rem;border-top:1px solid var(--border)}
.sb-user-info{font-size:11px;color:#444;margin-bottom:8px;padding:0 0.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-name{color:rgba(255,255,255,0.5);font-weight:500}
.btn-signout{width:100%;padding:0.5rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:3px;color:rgba(255,255,255,0.35);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.5px;transition:all 0.2s}
.btn-signout:hover{border-color:var(--crimson);color:var(--crimson)}
.main{margin-left:230px;flex:1;padding:2.5rem;min-height:100vh}

/* STAFF sidebar */
.app-shell.staff-mode .sidebar{background:#0a0a0a;border-right-color:rgba(192,22,44,0.3)}
.staff-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(192,22,44,0.15);border:1px solid rgba(192,22,44,0.3);border-radius:2px;padding:2px 8px;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--crimson);margin-bottom:8px}

/* page headers */
.page-hd{margin-bottom:2rem}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--ink);line-height:1}
.page-sub{font-size:13px;color:var(--muted);font-weight:300;margin-top:4px}
.page-title.light{color:var(--white)}
.page-sub.light{color:var(--muted)}

/* cards/panels */
.panel{background:var(--white);border:1px solid var(--border-light);border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
.panel-dark{background:var(--graphite);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
.panel-hd{padding:1rem 1.5rem;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.02)}
.panel-hd-dark{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--ink)}
.panel-title-light{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--white)}
.badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:2px;font-weight:600}
.badge-red{background:rgba(192,22,44,0.12);color:var(--crimson)}
.badge-green{background:rgba(45,106,79,0.12);color:var(--green)}
.badge-gold{background:rgba(184,149,42,0.12);color:var(--gold)}
.badge-muted{background:rgba(0,0,0,0.06);color:var(--muted)}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-box{background:var(--white);border:1px solid var(--border-light);border-radius:4px;padding:1.25rem 1.5rem;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.stat-box.s1::after{background:var(--crimson)}
.stat-box.s2::after{background:var(--green)}
.stat-box.s3::after{background:var(--gold)}
.stat-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:8px}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--ink);line-height:1}
.stat-val.accent{color:var(--crimson)}
.stat-hint{font-size:11px;color:var(--muted);font-weight:300;margin-top:6px}

/* belt indicator */
.belt-indicator{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--border-light);border-radius:4px;padding:0.85rem 1.25rem;margin-bottom:1.5rem}
.belt-color-dot{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.belt-info{flex:1}
.belt-rank{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--ink)}
.belt-progress-wrap{margin-top:4px}
.belt-bar{height:4px;background:var(--bone);border-radius:2px;overflow:hidden}
.belt-fill{height:100%;border-radius:2px;transition:width 1s ease}
.belt-pts-txt{font-size:11px;color:var(--muted);margin-top:3px}

/* reservas dashboard */
.reserva-row{display:flex;align-items:center;padding:1rem 1.5rem;border-bottom:1px solid rgba(0,0,0,0.05);gap:1rem}
.reserva-row:last-child{border-bottom:none}
.res-date{text-align:center;min-width:46px}
.res-day{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--crimson);line-height:1}
.res-mon{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.res-sep{width:1px;height:34px;background:var(--border-light)}
.res-info{flex:1}
.res-name{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:2px}
.res-detail{font-size:12px;color:var(--muted);font-weight:300}
.res-status{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:2px;font-weight:600}
.rs-confirmada{background:rgba(45,106,79,0.1);color:var(--green)}
.rs-pendiente{background:rgba(184,149,42,0.1);color:var(--gold)}

/* pedido row */
.pedido-row{display:flex;align-items:center;justify-content:space-between;padding:0.9rem 1.5rem;border-bottom:1px solid rgba(0,0,0,0.05)}
.pedido-row:last-child{border-bottom:none}
.ped-left{display:flex;align-items:center;gap:12px}
.ped-icon{width:36px;height:36px;border-radius:50%;background:var(--bone);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ped-name{font-size:14px;color:var(--ink);font-weight:500;margin-bottom:1px}
.ped-date{font-size:11px;color:var(--muted);font-weight:300}
.ped-right{text-align:right}
.ped-price{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--ink)}
.ped-pts{font-size:10px;color:var(--crimson);font-weight:600;margin-top:1px}

/* puntos */
.pts-body{padding:1.5rem}
.pts-rate-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(192,22,44,0.08);color:var(--crimson);padding:4px 12px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:0.5px;margin-bottom:1rem;border:1px solid rgba(192,22,44,0.2)}
.pts-bar-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:300}
.pts-bar{height:8px;background:var(--bone);border-radius:4px;overflow:hidden;margin-bottom:0.75rem}
.pts-fill{height:100%;background:linear-gradient(90deg,var(--crimson),var(--crimson-dark));border-radius:4px;transition:width 1s ease}
.pts-msg{font-size:12px;color:var(--muted);text-align:center;font-weight:300}
.pts-msg strong{color:var(--crimson);font-weight:600}

/* menú */
.cat-tabs{display:flex;gap:8px;padding:1rem 1.5rem 0;flex-wrap:wrap}

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const add = (msg, type="success", icon="✓") => {
    const id = Date.now();
    setToasts(t => [...t, {id,msg,type,icon}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
  };
  return [toasts, add];
}

                  <button className="btn-remove" onClick={()=>onRemove(x.id)}>🗑</button>

              <div className="drop-text">{file ? file.name : "Arrastra aquí tu comprobante o haz click para seleccionar"}</div>
              <div style={{fontSize:11,color:"var(--muted)",marginTop:4,fontWeight:300}}>PNG, JPG o PDF · Máx. 5MB</div>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",gap:"0.75rem",marginTop:"0.5rem"}}>
        <button style={{flex:1,padding:"0.75rem",background:"none",border:"1.5px solid var(--border-light)",borderRadius:3,fontSize:13,fontFamily:"'Inter',sans-serif",color:"var(--muted)",cursor:"pointer"}} onClick={onBack}>← Volver</button>
        <button className="btn-pay-confirm" style={{flex:2,marginTop:0}} disabled={!canPay} onClick={onConfirm}>Confirmar Pago →</button>
      </div>
    </div>
  );
}

  return (
    <div>
      <div className="page-hd"><div className="page-title">Mi Panel</div><div className="page-sub">Resumen de tu actividad en KO-ffee</div></div>
      <div className="stats-grid">
        <div className="stat-box s1"><div className="stat-lbl">Puntos acumulados</div><div className="stat-val accent">{puntos.toLocaleString()}</div><div className="stat-hint">Sistema: 100 pts / $1</div></div>
        <div className="stat-box s2"><div className="stat-lbl">Reservas activas</div><div className="stat-val">{reservas.length}</div><div className="stat-hint">{reservas.length>0?`Próxima: ${reservas[0].fecha}`:"Sin reservas"}</div></div>
        <div className="stat-box s3"><div className="stat-lbl">Pedidos realizados</div><div className="stat-val">{pedidos.length}</div><div className="stat-hint">{pedidos.length>0?`Último: ${pedidos[pedidos.length-1].fecha}`:"Sin pedidos"}</div></div>

          <div className="belt-progress-wrap">
            <div className="belt-bar"><div className="belt-fill" style={{width:pct+"%",background:belt.color}}/></div>
            <div className="belt-pts-txt">{puntos.toLocaleString()} pts · {nextBelt.min===Infinity?"Nivel máximo alcanzado":`Próximo nivel a los ${nextBelt.min.toLocaleString()} pts`}</div>

        </div>

      {/* reservas */}

            </div>
          ))

      {/* pedidos */}

        <div className="panel-hd"><span className="panel-title">Historial de Pedidos</span><span className="badge badge-green">{pedidos.length} pedidos</span></div>

              <div className="ped-left"><div className="ped-icon">🛍️</div>
                <div><div className="ped-name">{p.items.join(", ")}</div><div className="ped-date">{p.fecha}</div></div>
              </div>
              <div className="ped-right"><div className="ped-price">${p.total.toFixed(2)}</div><div className="ped-pts">+{p.pts.toLocaleString()} pts</div></div>

// ── RESERVAS ──────────────────────────────────────────────────────────────
function ReservasPage({ onReserva }) {
  const [sel, setSel] = useState(null);
  const [fecha, setFecha] = useState(""); const [hora, setHora] = useState(""); const [personas, setPersonas] = useState("2");
  const today = new Date().toISOString().split("T")[0];
  const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const handle = () => {
    if(!sel||!fecha||!hora) return;
    const d = new Date(fecha+"T12:00:00");
    onReserva({dia:String(d.getDate()).padStart(2,"0"),mes:meses[d.getMonth()],zona:sel.zona,mesa:sel.num,hora,personas:parseInt(personas),fecha:`${d.getDate()} ${meses[d.getMonth()]}`,estado:"confirmada"});
    setSel(null); setFecha(""); setHora(""); setPersonas("2");
  };
  return (
    <div>
      <div className="page-hd"><div className="page-title">Reservar Mesa</div><div className="page-sub">Elige tu zona favorita del Dojo</div></div>
      <div className="zonas-grid">
        {ZONAS_DATA.map(zona=>(
          <div className="zona-card" key={zona.id}>
            <div className="zona-hd"><span className="zona-icon">{zona.icon}</span>
              <div><div className="zona-name">{zona.nombre}</div><div className="zona-desc">{zona.desc}</div></div>
            </div>
            <div className="mesas-grid">
              {zona.mesas.map(m=>{
                const isSel = sel && sel.zona===zona.nombre && sel.num===m.num;
                return <button key={m.num} className={"mesa-btn "+(isSel?"seleccionada":m.libre?"libre":"ocupada")} disabled={!m.libre} onClick={()=>setSel({zona:zona.nombre,num:m.num,cap:m.cap})}>
                  Mesa {m.num}<div className="mesa-cap">{m.cap}p</div></button>;
              })}
            </div>
          </div>
        ))}
      </div>
      {sel && (
        <div className="panel">
          <div className="panel-hd"><span className="panel-title">Confirmar Reserva</span></div>
          <div className="reserva-form-panel">
            <div className="res-sel-info">⛩️ {sel.zona} · Mesa {sel.num} · hasta {sel.cap} persona{sel.cap>1?"s":""}</div>
            <div className="form-row" style={{marginBottom:"0.9rem"}}>
              <div className="form-group"><label className="form-label">Fecha</label>
                <input className="select-input" type="date" min={today} value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Hora</label>
                <input className="select-input" type="time" min="07:00" max="21:00" value={hora} onChange={e=>setHora(e.target.value)}/></div>
            </div>
            <div className="form-group" style={{marginBottom:"1rem"}}><label className="form-label">Personas</label>
              <select className="select-input" value={personas} onChange={e=>setPersonas(e.target.value)}>
                {[...Array(sel.cap)].map((_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select></div>
            <button className="btn-reservar" onClick={handle} disabled={!fecha||!hora}>Confirmar Reserva</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CLIENT DASHBOARD ──────────────────────────────────────────────────────
function ClientDashboard({ user, addToast }) {
  const meta = user.user_metadata || {};
  const nombre = meta.nombre_completo || user.email;
  const primerNombre = nombre.split(" ")[0];

  const [vista, setVista] = useState("panel");
  const [pedidos, setPedidos] = useState([]);
  const [reservas, setReservas] = useState([]);
  const [puntos, setPuntos] = useState(0);
  const [carrito, setCarrito] = useState([]);
  const [showCart, setShowCart] = useState(false);
  const [checkout, setCheckout] = useState(null);

  const addToCart = item => setCarrito(c=>{ const ex=c.find(x=>x.id===item.id); return ex?c.map(x=>x.id===item.id?{...x,qty:x.qty+1}:x):[...c,{...item,qty:1}]; });
  const updateQty = (id,d) => setCarrito(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const removeItem = id => setCarrito(c=>c.filter(x=>x.id!==id));

  const handleCheckout = resumen => { setShowCart(false); setCheckout(resumen); setVista("checkout"); };

  const confirmPay = () => {
    const now = new Date();
    const meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const fecha=`${now.getDate()} ${meses[now.getMonth()]} ${now.getFullYear()}`;
    setPedidos(p=>[...p,{items:carrito.map(x=>x.qty>1?`${x.nombre} ×${x.qty}`:x.nombre),total:checkout.total,pts:checkout.pts,fecha,kdsStatus:"recibido"}]);
    setPuntos(p=>p+checkout.pts);
    setCarrito([]); setCheckout(null); setVista("panel");
    addToast(`¡Pedido confirmado! +${checkout.pts.toLocaleString()} puntos acreditados 🥋`,"success","☕");
    setTimeout(()=>addToast("Tu pedido ha sido recibido por cocina","gold","🔥"),1500);
  };

  const addReserva = r => {
    setReservas(prev=>[...prev,r]);
    addToast("¡Reserva enviada! El staff la confirmará pronto 📅","success","📅");
  };

  const cartCount = carrito.reduce((s,x)=>s+x.qty,0);

  const nav = [
    {id:"panel",icon:"🏠",label:"Mi Panel"},
    {id:"menu",icon:"☕",label:"Menú"},
    {id:"reservas",icon:"📅",label:"Reservar Mesa"},
  ];

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sb-brand">
          <div className="sb-brand-icon">☕</div>
          <div><div className="sb-brand-name">KO<span>-ffee</span></div><div style={{fontSize:9,letterSpacing:"1.5px",textTransform:"uppercase",color:"var(--muted)",marginTop:2}}>Specialty Coffee</div></div>
        </div>
        <nav className="sb-nav">
          <div className="sb-section-label">Mi Cuenta</div>
          {nav.map(n=><button key={n.id} className={"nav-btn"+(vista===n.id&&vista!=="checkout"?" active":"")} onClick={()=>{setVista(n.id);setCheckout(null)}}><span className="nb-icon">{n.icon}</span>{n.label}</button>)}
        </nav>
        <div className="sb-footer">
          <div className="sb-user-info">👤 <span className="sb-user-name">{primerNombre}</span> · {puntos.toLocaleString()} pts</div>
          <button className="btn-signout" onClick={()=>sb.auth.signOut()}>Cerrar sesión</button>
        </div>
      </aside>
      <main className="main">
        {vista==="panel"    && <PanelGeneral pedidos={pedidos} reservas={reservas} puntos={puntos}/>}
        {vista==="menu"     && <MenuPage onAdd={addToCart}/>}
        {vista==="reservas" && <ReservasPage onReserva={addReserva}/>}
        {vista==="checkout" && checkout && <CheckoutPage resumen={checkout} carrito={carrito} onConfirm={confirmPay} onBack={()=>{setVista("menu");setCheckout(null)}}/>}
      </main>
      {/* FAB carrito */}
      {carrito.length>0 && vista!=="checkout" && (
        <button className="cart-fab" onClick={()=>setShowCart(true)}>
          <span>🛒 Ver pedido</span>
          <span className="cart-fab-count">{cartCount}</span>
          <span style={{color:"rgba(255,255,255,0.5)",fontSize:11}}>${carrito.reduce((s,x)=>s+x.precio*x.qty,0).toFixed(2)}</span>
        </button>
      )}
      {showCart && <CartDrawer carrito={carrito} onClose={()=>setShowCart(false)} onUpdate={updateQty} onRemove={removeItem} onCheckout={handleCheckout}/>}
    </div>
  );
}

// ── APP ROOT ──────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("landing"); // landing | login | register | app
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isStaff, setIsStaff] = useState(false);
  const [toasts, addToast] = useToasts();

  // estado global compartido entre client y staff
  const [globalPedidos, setGlobalPedidos] = useState([]);
  const [globalReservas, setGlobalReservas] = useState([]);

  useEffect(() => {
    sb.auth.getSession().then(({data:{session}})=>{ setSession(session); if(session) setScreen("app"); setLoading(false); });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_e,session)=>{
      setSession(session);
      if(session){ setIsStaff(session.user?.user_metadata?.is_staff||false); setScreen("app"); }
      else setScreen("landing");
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const addGlobalPedido = p => setGlobalPedidos(prev=>[...prev,p]);
  const addGlobalReserva = r => setGlobalReservas(prev=>[...prev,r]);
  const updateReserva = (i,estado) => setGlobalReservas(prev=>prev.map((r,idx)=>idx===i?{...r,estado}:r));
  const updatePedido = (i,status) => setGlobalPedidos(prev=>prev.map((p,idx)=>idx===i?{...p,kdsStatus:status}:p));

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--obsidian)",color:"#444",fontSize:13}}>Cargando…</div>;

  return (
    <>
      <ToastContainer toasts={toasts}/>
      {screen==="landing" && <LandingPage onGoLogin={()=>setScreen("login")}/>}
      {screen==="login"   && <LoginForm onSwitch={()=>setScreen("register")}/>}
      {screen==="register"&& <RegisterForm onSwitch={()=>setScreen("login")}/>}
      {screen==="app" && session && (
        isStaff || session.user?.user_metadata?.is_staff
          ? <StaffDashboard onSignOut={()=>sb.auth.signOut()} addToast={addToast} globalReservas={globalReservas} globalPedidos={globalPedidos} onUpdateReserva={updateReserva} onUpdatePedido={updatePedido}/>
          : <ClientDashboard user={session.user} addToast={(msg,type,icon)=>{ addToast(msg,type,icon); const p=globalPedidos[globalPedidos.length-1]; if(p) addGlobalPedido(p); }} globalReservas={globalReservas} onAddReserva={r=>{addGlobalReserva(r);}} />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
