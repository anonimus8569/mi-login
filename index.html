<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KO-ffee — Specialty Coffee & Taekwondo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --obsidian:#0c0c0c;
  --ink:#181818;
  --graphite:#242424;
  --steel:#303030;
  --carbon:#3a3a3a;
  --linen:#f4f1ec;
  --bone:#ece8e0;
  --mist:#d8d2c8;
  --muted:#8a847c;
  --crimson:#c01428;
  --crimson-dark:#8a0e1c;
  --crimson-glow:rgba(192,20,40,0.18);
  --white:#ffffff;
  --gold:#c49a28;
  --border-dark:#2a2a2a;
  --border-light:#e2dbd0;
  --success:#2a7a50;
  --warning:#b8831a;
}
body{font-family:'Inter',sans-serif;background:var(--linen);color:var(--ink);min-height:100vh}

/* ── BELT COLORS ── */
:root{
  --belt-white:#e8e8e8;
  --belt-yellow:#e8c830;
  --belt-green:#2d7a3a;
  --belt-blue:#1a4a9a;
  --belt-red:#c01428;
  --belt-black:#1a1a1a;
}

/* ══════════════════════════════
   LANDING
══════════════════════════════ */
.landing{background:var(--obsidian);color:var(--white);min-height:100vh}
.land-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;background:rgba(12,12,12,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-dark)}
.land-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--white)}
.land-logo span{color:var(--crimson)}
.land-nav-links{display:flex;gap:2rem}
.land-nav-links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:color .2s}
.land-nav-links a:hover{color:var(--white)}
.btn-nav{padding:.45rem 1.4rem;background:var(--crimson);color:var(--white);border:none;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-nav:hover{background:var(--crimson-dark)}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 2rem 4rem;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,rgba(192,20,40,.1) 0%,transparent 65%)}
.hero-kanji{font-family:'Noto Serif JP',serif;font-size:160px;font-weight:300;color:rgba(255,255,255,.03);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
.hero-eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--crimson);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:30px;height:1px;background:var(--crimson);opacity:.5}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,14vw,148px);letter-spacing:5px;line-height:.88;margin-bottom:1rem;position:relative;z-index:1}
.hero-title span{color:var(--crimson)}
.hero-sub{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:2.5rem;font-weight:300}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn-hero-p{padding:.85rem 2.5rem;background:var(--crimson);color:var(--white);border:none;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-hero-p:hover{background:var(--crimson-dark)}
.btn-hero-o{padding:.85rem 2.5rem;background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.2);border-radius:2px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-hero-o:hover{border-color:var(--white);background:rgba(255,255,255,.05)}
.land-section{padding:5rem 3rem;max-width:1180px;margin:0 auto}
.section-eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--crimson);margin-bottom:.75rem}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(38px,5vw,64px);letter-spacing:2px;line-height:.95;color:var(--white);margin-bottom:1.25rem}
.section-body{font-size:14px;color:var(--muted);font-weight:300;line-height:1.85;max-width:540px}
.land-divider{border:none;border-top:1px solid var(--border-dark);margin:0 3rem}
/* belt cards */
.belts-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;margin-top:2rem}
@media(max-width:900px){.belts-grid{grid-template-columns:repeat(3,1fr)}}
.belt-card{border:1px solid var(--border-dark);border-radius:3px;padding:1rem;background:var(--graphite);text-align:center;transition:border-color .2s,transform .15s}
.belt-card:hover{transform:translateY(-2px)}
.belt-stripe{height:6px;border-radius:2px;margin:0 auto 10px;width:50px}
.belt-card-name{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--white)}
.belt-card-pts{font-size:10px;color:var(--muted);margin-top:3px}
.belt-card-reward{font-size:10px;color:var(--crimson);margin-top:6px;font-weight:500}
/* info */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
@media(max-width:768px){.info-grid{grid-template-columns:1fr}}
.info-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--crimson);margin-bottom:.4rem}
.info-val{font-size:14px;color:var(--white);font-weight:300;line-height:1.75;margin-bottom:1.5rem}
.hours-row{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border-dark);font-size:13px}
.hours-row:last-child{border-bottom:none}
.hours-day{color:var(--muted);font-weight:300}
.hours-time{color:var(--white)}
.map-ph{background:var(--graphite);border:1px solid var(--border-dark);border-radius:3px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--muted)}
.map-ph-icon{font-size:32px;opacity:.4}
.map-ph-txt{font-size:12px;letter-spacing:.5px}
.social-row{display:flex;gap:.75rem;margin-top:1.25rem}
.social-btn{width:38px;height:38px;border:1px solid var(--border-dark);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:border-color .2s}
.social-btn:hover{border-color:var(--crimson)}
/* features */
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem}
@media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
.feat-card{border:1px solid var(--border-dark);border-radius:3px;padding:1.25rem;background:var(--graphite)}
.feat-icon{font-size:26px;margin-bottom:.75rem}
.feat-name{font-size:13px;font-weight:600;color:var(--white);margin-bottom:4px}
.feat-desc{font-size:11px;color:var(--muted);font-weight:300;line-height:1.5}

/* ══════════════════════════════
   AUTH
══════════════════════════════ */
.auth-page{min-height:100vh;display:flex;background:var(--obsidian)}
.auth-left{display:none;width:44%;flex-direction:column;justify-content:center;align-items:center;padding:3rem;text-align:center;position:relative;overflow:hidden;background:var(--graphite);border-right:1px solid var(--border-dark)}
@media(min-width:880px){.auth-left{display:flex}}
.auth-bg-kanji{font-family:'Noto Serif JP',serif;font-size:220px;font-weight:300;color:rgba(255,255,255,.025);position:absolute;line-height:1;user-select:none}
.auth-quote{font-family:'Noto Serif JP',serif;font-size:19px;font-style:italic;color:rgba(255,255,255,.55);line-height:1.65;position:relative;z-index:1}
.auth-quote-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:.75rem}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.auth-card{background:var(--graphite);border:1px solid var(--border-dark);border-radius:4px;padding:2.5rem 2.75rem;width:100%;max-width:420px;position:relative}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--crimson);border-radius:4px 4px 0 0}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem}
.auth-brand-icon{width:38px;height:38px;background:var(--crimson);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.auth-brand-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white)}
.auth-brand-name span{color:var(--crimson)}
.auth-brand-tag{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.auth-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--white);margin-bottom:.2rem}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;font-weight:300}
.form-group{margin-bottom:.85rem}
.form-label{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.35rem}
.form-input{width:100%;padding:.65rem .85rem;border:1px solid var(--border-dark);border-radius:3px;font-size:14px;font-family:'Inter',sans-serif;font-weight:300;color:var(--white);background:var(--steel);outline:none;transition:border-color .2s}
.form-input:focus{border-color:var(--crimson)}
.form-input::placeholder{color:#484848}
.form-input.light{color:var(--ink);background:var(--white);border-color:var(--border-light)}
.form-input.light:focus{border-color:var(--crimson)}
.form-input.light::placeholder{color:#bbb}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.btn-p{width:100%;padding:.8rem;background:var(--crimson);color:var(--white);border:none;border-radius:3px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:.5rem;transition:background .2s,transform .1s}
.btn-p:hover{background:var(--crimson-dark)}
.btn-p:active{transform:scale(.99)}
.btn-p:disabled{background:#333;color:#555;cursor:not-allowed}
.link-row{text-align:center;font-size:13px;color:var(--muted);margin-top:1.25rem;font-weight:300}
.link-btn{background:none;border:none;color:var(--crimson);font-weight:600;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;text-decoration:underline;text-underline-offset:2px}
.alert-err{background:rgba(192,20,40,.15);color:#ff7080;border-left:3px solid var(--crimson);padding:.7rem .9rem;border-radius:3px;font-size:13px;margin-bottom:1rem;font-weight:300}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* staff toggle */
.staff-box{border:1px solid var(--border-dark);border-radius:3px;padding:.85rem 1rem;background:var(--steel);margin-bottom:.85rem;transition:border-color .2s}
.staff-box.on{border-color:rgba(192,20,40,.5);background:rgba(192,20,40,.06)}
.staff-toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.staff-lbl{font-size:13px;color:var(--white);display:flex;align-items:center;gap:8px}
.sw{width:38px;height:20px;background:var(--border-dark);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--crimson)}
.sw-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--white);border-radius:50%;transition:transform .2s}
.sw.on .sw-knob{transform:translateX(18px)}

/* ══════════════════════════════
   APP SHELL
══════════════════════════════ */
.app{display:flex;min-height:100vh}
.sidebar{width:225px;flex-shrink:0;background:var(--obsidian);border-right:1px solid var(--border-dark);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:20}
.sb-top{padding:1.35rem 1.2rem;border-bottom:1px solid var(--border-dark);display:flex;align-items:center;gap:9px}
.sb-icon{width:34px;height:34px;background:var(--crimson);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sb-name{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;color:var(--white)}
.sb-name span{color:var(--crimson)}
.sb-tag{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.sb-nav{flex:1;padding:.85rem .7rem;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-sec{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:#3a3a3a;padding:.65rem .8rem .3rem;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:9px;padding:.58rem .8rem;border-radius:3px;font-size:13px;font-weight:400;color:rgba(255,255,255,.38);cursor:pointer;transition:all .15s;border:none;background:none;font-family:'Inter',sans-serif;width:100%;text-align:left;letter-spacing:.2px}
.nav-btn:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75)}
.nav-btn.active{background:rgba(192,20,40,.15);color:var(--crimson)}
.nav-btn .ni{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sb-foot{padding:1rem;border-top:1px solid var(--border-dark)}
.sb-user{font-size:11px;color:#3a3a3a;margin-bottom:7px;padding:0 .2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user strong{color:rgba(255,255,255,.45)}
.btn-logout{width:100%;padding:.48rem;background:rgba(255,255,255,.04);border:1px solid var(--border-dark);border-radius:3px;color:rgba(255,255,255,.3);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;letter-spacing:.4px}
.btn-logout:hover{border-color:var(--crimson);color:var(--crimson)}
.main{margin-left:225px;flex:1;padding:2.5rem;min-height:100vh;background:var(--linen)}
.main.dark{background:var(--ink)}

/* page header */
.page-hd{margin-bottom:1.75rem}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--ink);line-height:1}
.page-title.w{color:var(--white)}
.page-sub{font-size:13px;color:var(--muted);font-weight:300;margin-top:3px}

/* panels */
.panel{background:var(--white);border:1px solid var(--border-light);border-radius:4px;overflow:hidden;margin-bottom:1.25rem}
.panel-dark{background:var(--graphite);border:1px solid var(--border-dark);border-radius:4px;overflow:hidden;margin-bottom:1.25rem}
.ph{padding:.9rem 1.4rem;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.02)}
.ph-dark{padding:.9rem 1.4rem;border-bottom:1px solid var(--border-dark);display:flex;align-items:center;justify-content:space-between}
.pt{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:var(--ink)}
.pt.w{color:var(--white)}
.badge{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:2px;font-weight:700}
.br{background:rgba(192,20,40,.1);color:var(--crimson)}
.bg{background:rgba(42,122,80,.1);color:var(--success)}
.bgo{background:rgba(184,131,26,.1);color:var(--warning)}
.bm{background:rgba(0,0,0,.06);color:var(--muted)}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
.stat-box{background:var(--white);border:1px solid var(--border-light);border-radius:4px;padding:1.1rem 1.4rem;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.s1::after{background:var(--crimson)} .s2::after{background:var(--success)} .s3::after{background:var(--gold)}
.sl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.sv{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--ink);line-height:1}
.sv.red{color:var(--crimson)}
.sh{font-size:11px;color:var(--muted);font-weight:300;margin-top:5px}

/* belt indicator */
.belt-ind{display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--border-light);border-radius:4px;padding:.8rem 1.2rem;margin-bottom:1.25rem}
.belt-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,.1)}
.belt-ind-info{flex:1}
.belt-ind-name{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;color:var(--ink)}
.belt-bar{height:5px;background:var(--bone);border-radius:2px;overflow:hidden;margin-top:5px}
.belt-fill{height:100%;border-radius:2px;transition:width 1s ease}
.belt-pts-txt{font-size:10px;color:var(--muted);margin-top:3px}

/* reservas */
.res-row{display:flex;align-items:center;padding:.9rem 1.4rem;border-bottom:1px solid rgba(0,0,0,.04);gap:1rem}
.res-row:last-child{border-bottom:none}
.res-date{text-align:center;min-width:44px}
.res-day{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--crimson);line-height:1}
.res-mon{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.res-sep{width:1px;height:32px;background:var(--border-light)}
.res-info{flex:1}
.res-nm{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px}
.res-dt{font-size:11px;color:var(--muted);font-weight:300}
.res-st{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 9px;border-radius:2px;font-weight:700}
.rs-conf{background:rgba(42,122,80,.1);color:var(--success)}
.rs-pend{background:rgba(184,131,26,.1);color:var(--warning)}

/* pedidos historial */
.ped-row{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.4rem;border-bottom:1px solid rgba(0,0,0,.04)}
.ped-row:last-child{border-bottom:none}
.ped-l{display:flex;align-items:center;gap:11px}
.ped-ico{width:34px;height:34px;border-radius:50%;background:var(--bone);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ped-nm{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:1px}
.ped-dt{font-size:11px;color:var(--muted);font-weight:300}
.ped-r{text-align:right}
.ped-pr{font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--ink)}
.ped-pts{font-size:10px;color:var(--crimson);font-weight:700}

/* puntos section */
.pts-body{padding:1.4rem}
.pts-rate{display:inline-flex;align-items:center;gap:6px;background:rgba(192,20,40,.07);color:var(--crimson);padding:4px 12px;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:.4px;margin-bottom:1rem;border:1px solid rgba(192,20,40,.18)}
.pts-bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:300}
.pts-bar{height:8px;background:var(--bone);border-radius:4px;overflow:hidden;margin-bottom:.75rem}
.pts-fill{height:100%;border-radius:4px;transition:width 1s ease}
.pts-msg{font-size:12px;color:var(--muted);text-align:center;font-weight:300}
.pts-msg strong{color:var(--crimson);font-weight:700}

/* ── MENÚ ── */
.cat-tabs{display:flex;gap:8px;padding:1rem 1.4rem 0;flex-wrap:wrap}
.cat-tab{padding:.38rem .95rem;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1.5px solid var(--border-light);background:none;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.cat-tab.active{background:var(--ink);color:var(--white);border-color:var(--ink)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:1rem;padding:1.4rem}
.mc{border:1px solid var(--border-light);border-radius:4px;overflow:hidden;background:var(--white);transition:box-shadow .2s,transform .15s}
.mc:hover{box-shadow:0 4px 18px rgba(0,0,0,.1);transform:translateY(-2px)}
.mc-emoji{background:var(--bone);height:76px;display:flex;align-items:center;justify-content:center;font-size:34px}
.mc-body{padding:.8rem .95rem}
.mc-name{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px}

// ── TOAST HOOK ────────────────────────────────────────────────────────────
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const add = (msg, type="s", icon="✓") => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, {id, msg, type, icon}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 5000);
  };
  return [toasts, add];
}
function Toasts({ toasts }) {
  return <div className="toast-wrap">{toasts.map(t=>(
    <div key={t.id} className={"toast t-"+t.type}>
      <span className="toast-icon">{t.icon}</span>
      <span>{t.msg}</span>
    </div>
  ))}</div>;
}

function CartDrawer({ carrito, onClose, onUpdate, onRemove, onCheckout }) {
  const sub = carrito.reduce((s,x)=>s+x.precio*x.qty,0);
  const iva = sub * IVA;
  const total = sub + iva;
  const pts = Math.round(total * PTS_X_DOLAR);
  return (
    <>
      <div className="cart-overlay" onClick={onClose}/>
      <div className="cart-drawer">
        <div className="cart-hd">
          <div className="cart-hd-title">🛒 Mi Pedido</div>
          <button className="btn-close" onClick={onClose}>✕</button>
        </div>
        <div className="cart-items">
          {carrito.length===0
            ? <div className="cart-empty"><div style={{fontSize:44,marginBottom:12,opacity:.3}}>☕</div>Tu carrito está vacío.<br/>Explora el menú y añade tus favoritos.</div>
            : carrito.map(x=>(
              <div className="ci" key={x.id}>
                <div className="ci-em">{x.emoji}</div>
                <div className="ci-info"><div className="ci-nm">{x.nombre}</div><div className="ci-pr">${(x.precio*x.qty).toFixed(2)}</div></div>
                <div className="ci-qty">
                  <button className="qty-btn" onClick={()=>onUpdate(x.id,-1)}>−</button>
                  <span className="qty-n">{x.qty}</span>
                  <button className="qty-btn" onClick={()=>onUpdate(x.id,1)}>+</button>
                  <button className="btn-rm" onClick={()=>onRemove(x.id)}>🗑</button>
                </div>
              </div>
            ))
          }
        </div>
        {carrito.length>0 && (
          <div className="cart-foot">
            <div className="cart-totals">
              <div className="cart-line"><span>Subtotal</span><span>${sub.toFixed(2)}</span></div>
              <div className="cart-line"><span>IVA (12%)</span><span>${iva.toFixed(2)}</span></div>

          </div>
        )}
      </div>
    </>
  );
}

  );

// RESERVAS PAGE
// ══════════════════════════════════════════════════════════════════════════
function ReservasPage({ onReserva }) {
  const [sel, setSel] = useState(null);
  const [fecha, setFecha] = useState(""); const [hora, setHora] = useState(""); const [pax, setPax] = useState("2");
  const today = new Date().toISOString().split("T")[0];
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const handle = () => {
    if(!sel||!fecha||!hora) return;
    const d = new Date(fecha+"T12:00:00");
    onReserva({dia:String(d.getDate()).padStart(2,"0"),mes:MESES[d.getMonth()],zona:sel.zona,mesa:sel.num,hora,personas:parseInt(pax),fecha:`${d.getDate()} ${MESES[d.getMonth()]}`,estado:"pendiente"});
    setSel(null); setFecha(""); setHora(""); setPax("2");
  };
  return (
    <div>
      <div className="page-hd"><div className="page-title">Reservar Mesa</div><div className="page-sub">Elige tu zona del Dojang</div></div>
      <div className="zonas-grid">
        {ZONAS.map(zona=>(
          <div className="zona-card" key={zona.id}>
            <div className="zona-hd"><span style={{fontSize:19}}>{zona.icon}</span>
              <div><div className="zona-nm">{zona.nombre}</div><div className="zona-desc">{zona.desc}</div></div>
            </div>
            <div className="mesas-grid">
              {zona.mesas.map(m=>{
                const isSel = sel&&sel.zona===zona.nombre&&sel.num===m.num;
                return <button key={m.num} className={"mesa "+(isSel?"sel":m.libre?"libre":"ocupada")} disabled={!m.libre} onClick={()=>setSel({zona:zona.nombre,num:m.num,cap:m.cap})}>
                  Mesa {m.num}<div className="mesa-cap">{m.cap}p</div></button>;
              })}
            </div>
          </div>
        ))}
      </div>
      {sel && (
        <div className="panel">
          <div className="ph"><span className="pt">Confirmar Reserva</span></div>
          <div className="res-form-panel">
            <div className="res-sel-info">⛩️ {sel.zona} · Mesa {sel.num} · hasta {sel.cap}p</div>
            <div className="form-row" style={{marginBottom:".85rem"}}>
              <div className="form-group"><label className="form-label">Fecha</label>
                <input className="select-inp" type="date" min={today} value={fecha} onChange={e=>setFecha(e.target.value)}/></div>
              <div className="form-group"><label className="form-label">Hora</label>
                <input className="select-inp" type="time" min="07:00" max="21:00" value={hora} onChange={e=>setHora(e.target.value)}/></div>
            </div>
            <div className="form-group" style={{marginBottom:"1rem"}}><label className="form-label">Personas</label>
              <select className="select-inp" value={pax} onChange={e=>setPax(e.target.value)}>
                {[...Array(sel.cap)].map((_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select></div>
            <button className="btn-reservar" onClick={handle} disabled={!fecha||!hora}>Confirmar Reserva</button>
          </div>
        </div>
      )}
    </div>
  );
}

// MURO DE COMENTARIOS (público, persiste en localStorage)
// ══════════════════════════════════════════════════════════════════════════
function MuroDojang({ currentUser, onBack }) {
  const loadComments = () => {
    try { const r = localStorage.getItem(LS_COMMENTS); return r ? JSON.parse(r) : []; } catch { return []; }
  };
  const [comments, setComments] = useState(loadComments);
  const [text, setText] = useState("");
  const [anonName, setAnonName] = useState("");
  const isLoggedIn = !!currentUser;
  const authorName = isLoggedIn ? (currentUser.user_metadata?.nombre_completo || currentUser.email.split("@")[0]) : (anonName.trim() || "Anónimo");
  const authorBelt = isLoggedIn ? getBelt(currentUser.user_metadata?.puntos || 0) : null;

  const addComment = () => {
    if(!text.trim()) return;
    const now = new Date();
    const fmt = now.toLocaleString("es-EC",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
    const nc = { id:Date.now(), author:authorName, time:fmt, text:text.trim(), belt: authorBelt?.nombre || null, beltColor: authorBelt?.color || null };
    const updated = [nc, ...comments];
    setComments(updated);
    localStorage.setItem(LS_COMMENTS, JSON.stringify(updated));
    setText("");
  };

  const initials = name => name.split(" ").map(n=>n[0]).slice(0,2).join("").toUpperCase();

  return (
    <div style={{maxWidth:700,margin:"0 auto"}}>
      <div style={{marginBottom:"1.5rem",display:"flex",alignItems:"center",gap:"1rem"}}>
        <button className="btn-back" onClick={onBack}>← Volver</button>
        <div>
          <div className="page-title">💬 Muro del Dojang</div>
          <div className="page-sub">Comentarios de la comunidad KO-ffee — visible para todos</div>
        </div>
      </div>

      {/* Formulario */}
      <div className="comment-form">
        {!isLoggedIn && (
          <div className="form-group" style={{marginBottom:".75rem"}}>
            <input className="form-input light" type="text" placeholder="Tu nombre (opcional — aparecerá como 'Anónimo' si no pones nada)" value={anonName} onChange={e=>setAnonName(e.target.value)} style={{marginBottom:0}}/>
          </div>
        )}
        {isLoggedIn && (
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:".85rem"}}>
            <div className="comment-avatar" style={{background: authorBelt?.color || "var(--ink)"}}>{initials(authorName)}</div>
            <div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--ink)"}}>{authorName}</div>
              {authorBelt && <div style={{fontSize:10,color:authorBelt.color,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>🥋 Cinturón {authorBelt.nombre}</div>}
            </div>
          </div>
        )}
        <textarea placeholder="Escribe tu experiencia, sugerencia o saludo a la comunidad KO-ffee… ☕" value={text} onChange={e=>setText(e.target.value)}/>
        <button className="btn-comment" onClick={addComment} disabled={!text.trim()}>Publicar en el Muro</button>
      </div>

      {/* Lista */}
      {comments.length===0
        ? <div className="panel"><div className="empty">Sé el primero en dejar un comentario en el Muro del Dojang 🥋</div></div>
        : comments.map(c=>(
          <div className="comment-card" key={c.id}>
            <div className="comment-meta">
              <div className="comment-avatar" style={{background:c.beltColor||"var(--ink)"}}>{initials(c.author)}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span className="comment-author">{c.author}</span>
                  {c.belt && <span style={{fontSize:9,letterSpacing:1,textTransform:"uppercase",padding:"2px 7px",borderRadius:2,fontWeight:700,background:c.beltColor+"22",color:c.beltColor}}>C. {c.belt}</span>}
                </div>
                <div className="comment-time">{c.time}</div>
              </div>
            </div>
            <div className="comment-text">{c.text}</div>
          </div>
        ))
      }
    </div>
  );
}

              {reservas.length===0 ? <div className="empty" style={{color:"#444"}}>Sin reservas activas</div>
                : <table className="s-table">
                  <thead><tr><th>Mesa</th><th>Zona</th><th>Fecha</th><th>Hora</th><th>Pax</th><th>Estado</th><th>Acción</th></tr></thead>
                  <tbody>
                    {reservas.map((r,i)=>(
                      <tr key={i}>
                        <td style={{color:"var(--white)",fontWeight:600}}>Mesa {r.mesa}</td>
                        <td>{r.zona}</td><td>{r.dia} {r.mes}</td><td>{r.hora}</td><td>{r.personas}p</td>
                        <td><span className={"res-st "+(r.estado==="aceptada"?"rs-conf":"rs-pend")}>{r.estado==="aceptada"?"Aceptada":"Pendiente"}</span></td>
                        <td style={{display:"flex",gap:6}}>
                          {r.estado!=="aceptada"&&<button className="btn-s bs-a" onClick={()=>{onUpdateReserva(i,"aceptada");addToast(`Reserva aceptada — ${r.zona} Mesa ${r.mesa}`,"s","📅");}}>Aceptar</button>}
                          {r.estado==="aceptada"&&<button className="btn-s bs-f" disabled>Finalizada</button>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              }
            </div>
          </div>
        )}

        {vista==="clientes" && (
          <div>
            <div className="page-hd"><div className="page-title w">Control de Clientes</div><div className="page-sub">Busca y ajusta puntos</div></div>
            <div className="panel-dark">
              <div className="ph-dark"><span className="pt w">Buscador</span></div>
              <div className="search-bar">
                <input className="search-inp" placeholder="Nombre o correo…" value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&searchClient()}/>
                <button className="btn-search" onClick={searchClient}>Buscar</button>
              </div>
              <div style={{padding:"1.1rem 1.4rem"}}>
                {foundClient==="notfound"&&<div style={{color:"#444",fontSize:13,fontStyle:"italic"}}>No se encontró ningún cliente.</div>}
                {foundClient&&foundClient!=="notfound"&&(
                  <div className="client-card">
                    <div className="cc-name">{foundClient.nombre}</div>
                    <div className="cc-meta">{foundClient.email} · {getBelt(foundClient.puntos).nombre}</div>
                    <div className="cc-stats">
                      <div className="cc-stat"><div className="ccv r">{foundClient.puntos.toLocaleString()}</div><div className="ccl">Puntos</div></div>
                      <div className="cc-stat"><div className="ccv">{foundClient.pedidos}</div><div className="ccl">Pedidos</div></div>
                      <div className="cc-stat"><div className="ccv">{foundClient.reservas}</div><div className="ccl">Reservas</div></div>
                    </div>
                    <div className="pts-adj">
                      <input className="pts-adj-inp" type="number" placeholder="Puntos a ajustar…" value={ptsAdj} onChange={e=>setPtsAdj(e.target.value)}/>
                      <button className="btn-pts-a" onClick={()=>{if(ptsAdj){addToast(`+${parseInt(ptsAdj).toLocaleString()} pts añadidos a ${foundClient.nombre.split(" ")[0]}`,"s","✓");setPtsAdj("")}}}>+ Añadir</button>
                      <button className="btn-pts-s" onClick={()=>{if(ptsAdj){addToast(`-${parseInt(ptsAdj).toLocaleString()} pts descontados`,"r","−");setPtsAdj("")}}}>− Quitar</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// CLIENT SHELL
// ══════════════════════════════════════════════════════════════════════════
function ClientShell({ user, addToast, sharedOrders, onAddOrder, onGoMuro }) {
  const meta = user.user_metadata || {};
  const nombre = meta.nombre_completo || user.email;
  const primerNombre = nombre.split(" ")[0];

  const [vista, setVista] = useState("panel");
  const [pedidos, setPedidos] = useState([]);
  const [reservas, setReservas] = useState([]);
  const [puntos, setPuntos] = useState(0);
  const [carrito, setCarrito] = useState([]);
  const [showCart, setShowCart] = useState(false);
  const [checkout, setCheckout] = useState(null);

  // Sincronizar estados de pedidos del cliente con el estado global (Staff los actualiza)
  useEffect(() => {
    pedidos.forEach((p, idx) => {
      const shared = sharedOrders.find(o => o.clientId === p.clientId);
      if (shared && shared.kStatus !== p.kStatus) {
        setPedidos(prev => prev.map((x,i) => i===idx ? {...x,kStatus:shared.kStatus} : x));
        if (shared.kStatus === "preparacion") addToast("🔥 Tu pedido ha entrado a preparación","g","🔥");
        if (shared.kStatus === "listo") addToast("✅ ¡Tu orden está lista para retirar! Por favor déjanos tu feedback en el Muro del Dojang 💬","s","✅");
      }
    });
  }, [sharedOrders]);

  const addToCart = item => setCarrito(c=>{ const ex=c.find(x=>x.id===item.id); return ex?c.map(x=>x.id===item.id?{...x,qty:x.qty+1}:x):[...c,{...item,qty:1}]; });
  const updateQty = (id,d) => setCarrito(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const removeItem = id => setCarrito(c=>c.filter(x=>x.id!==id));
  const handleCheckout = resumen => { setShowCart(false); setCheckout(resumen); setVista("checkout"); };

  const confirmPay = (method, subMethod) => {
    const payMethod = method==="card" ? "card" : subMethod;
    const now = new Date();
    const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const fecha = `${now.getDate()} ${MESES[now.getMonth()]} ${now.getFullYear()}`;
    const clientId = Date.now();
    // Estado inicial según método de pago
    const kStatus = payMethod==="card" ? "espera" : "pendiente";
    const newOrder = { id:clientId, clientId, items:carrito.map(x=>x.qty>1?`${x.nombre} ×${x.qty}`:x.nombre), total:checkout.total, pts:checkout.pts, fecha, payMethod, kStatus };

    setPedidos(p=>[...p, newOrder]);
    onAddOrder(newOrder);

    if (payMethod==="card") {
      setPuntos(p=>p+checkout.pts);
      addToast(`¡Pedido confirmado! +${checkout.pts.toLocaleString()} pts acreditados 🥋`,"s","☕");
      setTimeout(()=>addToast("Tu pedido ha entrado a la cola de preparación 🔥","g","🔥"),1200);
    } else {
      addToast(`Pedido enviado — Pendiente de validación por el Staff ⏳`,"g","⏳");
      if(payMethod==="efectivo") addToast("Recuerda pagar en caja al llegar 💵","g","💵");
    }

    setCarrito([]); setCheckout(null); setVista("panel");
  };

  const addReserva = r => {
    setReservas(prev=>[...prev, r]);
    addToast("Reserva enviada — el Staff la confirmará pronto 📅","g","📅");
  };

  const cartCount = carrito.reduce((s,x)=>s+x.qty,0);
  const navItems = [{id:"panel",icon:"🏠",label:"Mi Panel"},{id:"menu",icon:"☕",label:"Menú"},{id:"reservas",icon:"📅",label:"Reservar Mesa"}];

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sb-top">
          <div className="sb-icon">☕</div>
          <div><div className="sb-name">KO<span>-ffee</span></div><div className="sb-tag">Specialty Coffee</div></div>
        </div>
        <nav className="sb-nav">
          <div className="sb-sec">Mi Cuenta</div>
          {navItems.map(n=><button key={n.id} className={"nav-btn"+(vista===n.id&&vista!=="checkout"?" active":"")} onClick={()=>{setVista(n.id);setCheckout(null)}}><span className="ni">{n.icon}</span>{n.label}</button>)}
          <div className="sb-sec">Comunidad</div>
          <button className="nav-btn" onClick={onGoMuro}><span className="ni">💬</span>Muro del Dojang</button>
        </nav>
        <div className="sb-foot">
          <div className="sb-user">👤 <strong>{primerNombre}</strong> · {puntos.toLocaleString()} pts</div>
          <button className="btn-logout" onClick={()=>sb.auth.signOut()}>Cerrar sesión</button>
        </div>
      </aside>
      <main className="main">
        {vista==="panel"    && <PanelGeneral pedidos={pedidos} reservas={reservas} puntos={puntos}/>}
        {vista==="menu"     && <MenuPage onAdd={addToCart}/>}
        {vista==="reservas" && <ReservasPage onReserva={addReserva}/>}
        {vista==="checkout" && checkout && <CheckoutPage resumen={checkout} carrito={carrito} onConfirm={confirmPay} onBack={()=>{setVista("menu");setCheckout(null)}}/>}
      </main>
      {carrito.length>0 && vista!=="checkout" && (
        <button className="cart-fab" onClick={()=>setShowCart(true)}>
          <span>🛒 Pedido</span>
          <span className="cart-fab-n">{cartCount}</span>
          <span style={{color:"rgba(255,255,255,.5)",fontSize:11}}>${carrito.reduce((s,x)=>s+x.precio*x.qty,0).toFixed(2)}</span>
        </button>
      )}
      {showCart && <CartDrawer carrito={carrito} onClose={()=>setShowCart(false)} onUpdate={updateQty} onRemove={removeItem} onCheckout={handleCheckout}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState("landing"); // landing | login | register | app | muro
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [isStaff, setIsStaff] = useState(false);
  const [toasts, addToast] = useToasts();

  // Estado global de pedidos (compartido entre cliente y staff)
  const [sharedOrders, setSharedOrders] = useState([]);
  const [sharedReservas, setSharedReservas] = useState([]);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session){ setIsStaff(session.user?.user_metadata?.is_staff||false); setScreen("app"); }
      setLoading(false);
    });
    const {data:{subscription}} = sb.auth.onAuthStateChange((_e,session)=>{
      setSession(session);
      if(session){ setIsStaff(session.user?.user_metadata?.is_staff||false); setScreen("app"); }
      else setScreen("landing");
    });
    return ()=>subscription.unsubscribe();
  },[]);

  const addOrder = order => setSharedOrders(prev=>[...prev, order]);
  const addReserva = r => setSharedReservas(prev=>[...prev, r]);

  const advanceOrder = id => {
    setSharedOrders(prev=>prev.map(o=>{
      if(o.id!==id) return o;
      const next = o.kStatus==="espera"?"preparacion":o.kStatus==="preparacion"?"listo":"listo";
      return {...o, kStatus:next};
    }));
  };

  const validateOrder = id => {
    setSharedOrders(prev=>prev.map(o=>o.id===id?{...o,kStatus:"espera"}:o));
  };

  const updateReserva = (i, estado) => setSharedReservas(prev=>prev.map((r,idx)=>idx===i?{...r,estado}:r));

  if(loading) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--obsidian)",color:"#333",fontSize:13}}>Cargando…</div>;

  return (
    <>
      <Toasts toasts={toasts}/>
      {screen==="landing" && <LandingPage onGoLogin={()=>setScreen("login")} onGoMuro={()=>setScreen("muro")}/>}
      {screen==="login"   && <LoginForm onSwitch={()=>setScreen("register")}/>}
      {screen==="register"&& <RegisterForm onSwitch={()=>setScreen("login")}/>}
      {screen==="muro"    && (
        <div className="muro-page">
          <MuroDojang currentUser={session?.user||null} onBack={()=>setScreen(session?"app":"landing")}/>
        </div>
      )}
      {screen==="app" && session && (
        isStaff
          ? <StaffDashboard
              onSignOut={()=>sb.auth.signOut()}
              addToast={addToast}
              orders={sharedOrders}
              reservas={sharedReservas}
              onAdvanceOrder={advanceOrder}
              onValidateOrder={validateOrder}
              onUpdateReserva={updateReserva}/>
          : <ClientShell
              user={session.user}
              addToast={addToast}
              sharedOrders={sharedOrders}
              onAddOrder={addOrder}
              onGoMuro={()=>setScreen("muro")}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
