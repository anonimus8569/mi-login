<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KO-ffee 커피 — Specialty Coffee & Dojang</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Taegeukgi palette */
  --yang:#CD2E3A;      /* Korean red/yang */
  --yang-dark:#9a1e28;
  --yang-glow:rgba(205,46,58,.14);
  --eum:#003478;       /* Korean blue/eum */
  --eum-light:#e8eef8;
  --eum-glow:rgba(0,52,120,.12);
  /* Dobok whites */
  --dobok:#FAFAF8;     /* pure dobok white */
  --ivory:#F5F2EC;     /* warm ivory */
  --paper:#EDE9E0;     /* rice paper */
  --linen:#E8E3D8;
  /* Inks */
  --ink:#1C1C1C;
  --ink-soft:#2E2E2E;
  --muted:#7A7468;
  --muted-light:#A8A29A;
  /* Borders */
  --border:#DDD8CF;
  --border-dark:#2A2A2A;
  /* Staff dark */
  --staff-bg:#0E0E0E;
  --staff-card:#1A1A1A;
  --staff-border:#272727;
  /* Gold for black belt */
  --gold:#C4962A;
  --gold-light:#F5E8C0;
  /* Status */
  --ok:#1E7A45;
  --ok-bg:rgba(30,122,69,.1);
  --warn:#B07A1A;
  --warn-bg:rgba(176,122,26,.1);
}
body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
.hangul{font-family:'Noto Sans KR',sans-serif}
.myeongjo{font-family:'Nanum Myeongjo',serif}

/* ─── TAEGEUK SVG decorations ─── */
.taegeuk-divider{display:flex;align-items:center;gap:1rem;margin:0 auto}
.taegeuk-divider::before,.taegeuk-divider::after{content:'';flex:1;height:1px}
.td-dark::before,.td-dark::after{background:rgba(255,255,255,.08)}
.td-light::before,.td-light::after{background:var(--border)}

/* trigram decorative chars */
.trigram{font-size:22px;opacity:.35;user-select:none}

/* ─── LANDING ─── */
.landing{background:var(--ink);color:var(--dobok);min-height:100vh;overflow:hidden}
.land-nav{position:fixed;top:0;left:0;right:0;z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 3rem;background:rgba(14,14,14,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--staff-border)}
.land-logo{display:flex;align-items:baseline;gap:8px}
.land-logo-main{font-family:'Nanum Myeongjo',serif;font-size:22px;font-weight:800;color:var(--dobok);letter-spacing:2px}
.land-logo-main span{color:var(--yang)}
.land-logo-hangul{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:300;color:rgba(255,255,255,.28);letter-spacing:1px}
.land-nav-links{display:flex;gap:2rem}
.land-nav-links a{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);cursor:pointer;transition:color .2s;font-weight:500}
.land-nav-links a:hover{color:var(--dobok)}
.btn-nav-login{padding:.45rem 1.5rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-nav-login:hover{background:var(--yang-dark)}

/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7rem 2rem 4rem;position:relative;overflow:hidden}
.hero-bg-taegeuk{position:absolute;width:600px;height:600px;border-radius:50%;background:conic-gradient(from 180deg at 50% 50%,var(--yang) 0deg,var(--yang) 180deg,var(--eum) 180deg,var(--eum) 360deg);opacity:.035;filter:blur(2px);pointer-events:none}
.hero-trigrams{position:absolute;font-size:100px;opacity:.03;letter-spacing:20px;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;font-family:'Noto Sans KR',sans-serif;pointer-events:none}
.hero-eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--yang);margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:28px;height:1px;background:var(--yang);opacity:.5}
.hero-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(72px,12vw,138px);font-weight:800;letter-spacing:3px;line-height:.88;margin-bottom:.5rem;position:relative;z-index:1}
.hero-title span{color:var(--yang)}
.hero-hangul-sub{font-family:'Noto Sans KR',sans-serif;font-size:clamp(16px,2.5vw,28px);font-weight:300;color:rgba(255,255,255,.22);letter-spacing:6px;margin-bottom:.85rem}
.hero-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2.5rem;font-weight:400}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.btn-hero-yang{padding:.9rem 2.75rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s}
.btn-hero-yang:hover{background:var(--yang-dark)}
.btn-hero-eum{padding:.9rem 2.75rem;background:transparent;color:var(--dobok);border:1.5px solid rgba(255,255,255,.18);border-radius:2px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.btn-hero-eum:hover{border-color:var(--dobok);background:rgba(255,255,255,.05)}

/* landing sections */
.land-section{padding:5.5rem 3rem;max-width:1160px;margin:0 auto}
.sec-eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--yang);margin-bottom:.75rem;font-weight:600}
.sec-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(36px,4.5vw,62px);font-weight:800;letter-spacing:1px;line-height:.95;color:var(--dobok);margin-bottom:.75rem}
.sec-hangul{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:300;color:rgba(255,255,255,.18);letter-spacing:4px;margin-bottom:1.25rem}
.sec-body{font-size:14px;color:rgba(255,255,255,.42);font-weight:300;line-height:1.9;max-width:520px}
.land-hr{border:none;border-top:1px solid var(--staff-border);margin:0 3rem}

/* belt cards landing */
.belts-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.85rem;margin-top:2rem}
@media(max-width:960px){.belts-grid{grid-template-columns:repeat(3,1fr)}}
.belt-card-land{border:1px solid rgba(255,255,255,.06);border-radius:3px;padding:1.1rem .85rem;background:rgba(255,255,255,.03);text-align:center;transition:border-color .2s,transform .15s;cursor:default}
.belt-card-land:hover{transform:translateY(-3px)}
.belt-stripe-wide{height:5px;border-radius:2px;margin:0 auto 10px;width:60%}
.bc-name{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;color:var(--dobok)}
.bc-hangul{font-family:'Noto Sans KR',sans-serif;font-size:11px;color:rgba(255,255,255,.25);margin-top:2px;letter-spacing:1px}
.bc-pts{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px;font-weight:300}
.bc-reward{font-size:10px;color:var(--yang);margin-top:6px;font-weight:500}

/* info section */
.info-2col{display:grid;grid-template-columns:1fr 1fr;gap:3.5rem;align-items:start}
@media(max-width:768px){.info-2col{grid-template-columns:1fr}}
.info-lbl{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--yang);margin-bottom:.4rem;font-weight:600}
.info-val{font-size:14px;color:rgba(255,255,255,.5);font-weight:300;line-height:1.8;margin-bottom:1.5rem}
.hours-row{display:flex;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--staff-border);font-size:13px}
.hours-row:last-child{border-bottom:none}
.h-day{color:rgba(255,255,255,.3);font-weight:300}
.h-time{color:var(--dobok);font-weight:400}
.map-ph{background:rgba(255,255,255,.03);border:1px solid var(--staff-border);border-radius:3px;height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:rgba(255,255,255,.2)}
.map-ph-txt{font-size:12px;letter-spacing:.5px}
.social-row{display:flex;gap:.75rem;margin-top:1.25rem}
.social-btn{width:36px;height:36px;border:1px solid var(--staff-border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:border-color .2s}
.social-btn:hover{border-color:var(--yang)}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;margin-top:2rem}
@media(max-width:880px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
.feat-card{border:1px solid rgba(255,255,255,.05);border-radius:3px;padding:1.2rem;background:rgba(255,255,255,.02)}
.feat-icon{font-size:24px;margin-bottom:.65rem}
.feat-nm{font-size:13px;font-weight:600;color:var(--dobok);margin-bottom:3px}
.feat-desc{font-size:11px;color:rgba(255,255,255,.3);font-weight:300;line-height:1.55}

/* ─── AUTH ─── */
.auth-page{min-height:100vh;display:flex;background:var(--ink)}
.auth-left{display:none;width:44%;flex-direction:column;justify-content:center;align-items:center;padding:3rem;text-align:center;position:relative;overflow:hidden;background:var(--staff-card);border-right:1px solid var(--staff-border)}
@media(min-width:900px){.auth-left{display:flex}}
.auth-bg-hangul{font-family:'Noto Sans KR',sans-serif;font-size:200px;font-weight:700;color:rgba(255,255,255,.022);position:absolute;line-height:1;user-select:none;pointer-events:none}
.auth-quote{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:400;color:rgba(255,255,255,.5);line-height:1.7;position:relative;z-index:1;font-style:italic}
.auth-quote-sub{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.22);margin-top:.75rem;font-weight:500}
.auth-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.auth-card{background:var(--staff-card);border:1px solid var(--staff-border);border-radius:3px;padding:2.5rem 2.75rem;width:100%;max-width:420px;position:relative}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--yang),var(--eum));border-radius:3px 3px 0 0}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:1.75rem}
.auth-brand-icon{width:38px;height:38px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,var(--yang),var(--eum))}
.auth-brand-text{}
.auth-brand-name{font-family:'Nanum Myeongjo',serif;font-size:21px;font-weight:800;color:var(--dobok);letter-spacing:1px}
.auth-brand-name span{color:var(--yang)}
.auth-brand-hangul{font-family:'Noto Sans KR',sans-serif;font-size:10px;font-weight:300;color:rgba(255,255,255,.25);letter-spacing:2px}
.auth-title{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:800;color:var(--dobok);margin-bottom:.2rem}
.auth-sub{font-size:13px;color:rgba(255,255,255,.35);margin-bottom:1.5rem;font-weight:300}
/* form elements */
.fl{display:block;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.32);letter-spacing:1.8px;text-transform:uppercase;margin-bottom:.32rem}
.fi{width:100%;padding:.65rem .85rem;border:1px solid var(--staff-border);border-radius:2px;font-size:14px;font-family:'Inter',sans-serif;font-weight:300;color:var(--dobok);background:rgba(255,255,255,.04);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--yang)}
.fi::placeholder{color:#3a3a3a}
.fi-light{color:var(--ink);background:var(--dobok);border:1.5px solid var(--border)}
.fi-light:focus{border-color:var(--yang)}
.fi-light::placeholder{color:#bbb}
.fg{margin-bottom:.85rem}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.btn-yang{width:100%;padding:.82rem;background:var(--yang);color:var(--dobok);border:none;border-radius:2px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:.5rem;transition:background .2s,transform .1s}
.btn-yang:hover{background:var(--yang-dark)}
.btn-yang:active{transform:scale(.99)}
.btn-yang:disabled{background:#2a2a2a;color:#3a3a3a;cursor:not-allowed}
.link-row{text-align:center;font-size:13px;color:rgba(255,255,255,.28);margin-top:1.25rem;font-weight:300}
.link-btn{background:none;border:none;color:var(--yang);font-weight:600;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;text-decoration:underline;text-underline-offset:2px}
.alert-err{background:rgba(205,46,58,.13);color:#ff8088;border-left:2px solid var(--yang);padding:.65rem .9rem;border-radius:2px;font-size:13px;margin-bottom:.85rem;font-weight:300}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* staff toggle */
.staff-box{border:1px solid var(--staff-border);border-radius:2px;padding:.85rem 1rem;background:rgba(255,255,255,.03);margin-bottom:.85rem;transition:border-color .2s}
.staff-box.on{border-color:rgba(0,52,120,.5);background:rgba(0,52,120,.08)}
.staff-toggle-row{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:.75rem}
.staff-lbl{font-size:13px;color:var(--dobok);display:flex;align-items:center;gap:8px;flex:1}
.sw{width:38px;height:20px;background:rgba(255,255,255,.1);border-radius:10px;position:relative;transition:background .2s;flex-shrink:0}
.sw.on{background:var(--eum)}
.sw-knob{position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dobok);border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .sw-knob{transform:translateX(18px)}
/* restricted badge */
.restricted-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(0,52,120,.15);border:1px solid rgba(0,52,120,.3);border-radius:2px;padding:2px 9px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(130,160,220,.8);font-weight:600}

/* ─── APP SHELL ─── */
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:228px;flex-shrink:0;background:var(--staff-bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:20;border-right:1px solid var(--staff-border)}
.sb-top{padding:1.35rem 1.25rem;border-bottom:1px solid var(--staff-border);display:flex;align-items:center;gap:10px}
.sb-icon-wrap{width:34px;height:34px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,var(--yang),var(--eum))}
.sb-brand-text{}
.sb-brand-name{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:800;color:var(--dobok);letter-spacing:1px}
.sb-brand-name span{color:var(--yang)}
.sb-brand-hangul{font-family:'Noto Sans KR',sans-serif;font-size:9px;font-weight:300;color:rgba(255,255,255,.2);letter-spacing:2px}
.sb-nav{flex:1;padding:.85rem .7rem;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-sec{font-size:8px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.18);padding:.65rem .8rem .3rem;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:9px;padding:.58rem .82rem;border-radius:2px;font-size:13px;font-weight:400;color:rgba(255,255,255,.32);cursor:pointer;transition:all .15s;border:none;background:none;font-family:'Inter',sans-serif;width:100%;text-align:left}
.nav-btn:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
.nav-btn.active{background:var(--yang-glow);color:var(--yang);border-right:2px solid var(--yang)}
.nav-btn .ni{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sb-foot{padding:1rem;border-top:1px solid var(--staff-border)}
.sb-user-info{font-size:11px;color:rgba(255,255,255,.2);margin-bottom:7px;padding:0 .2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-info strong{color:rgba(255,255,255,.42)}
.btn-signout{width:100%;padding:.48rem;background:rgba(255,255,255,.03);border:1px solid var(--staff-border);border-radius:2px;color:rgba(255,255,255,.25);font-size:11px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;letter-spacing:.4px}
.btn-signout:hover{border-color:var(--yang);color:var(--yang)}
.main{margin-left:228px;flex:1;padding:2.5rem;min-height:100vh}
.main-light{background:var(--ivory)}
.main-dark{background:var(--ink)}

/* page header */
.page-hd{margin-bottom:1.75rem}
.page-title-light{font-family:'Nanum Myeongjo',serif;font-size:32px;font-weight:800;color:var(--ink);letter-spacing:.5px;line-height:1}
.page-title-dark{font-family:'Nanum Myeongjo',serif;font-size:32px;font-weight:800;color:var(--dobok);letter-spacing:.5px;line-height:1}
.page-hangul{font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:300;color:var(--muted-light);letter-spacing:3px;margin-top:2px}
.page-sub{font-size:13px;color:var(--muted);font-weight:300;margin-top:3px}

/* panels */
.panel{background:var(--dobok);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:1.25rem}
.panel-dark{background:var(--staff-card);border:1px solid var(--staff-border);border-radius:3px;overflow:hidden;margin-bottom:1.25rem}
.ph{padding:.88rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.02)}
.ph-dark{padding:.88rem 1.4rem;border-bottom:1px solid var(--staff-border);display:flex;align-items:center;justify-content:space-between}
.pt{font-family:'Nanum Myeongjo',serif;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.3px}
.pt-w{font-family:'Nanum Myeongjo',serif;font-size:16px;font-weight:700;color:var(--dobok);letter-spacing:.3px}
.badge{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border-radius:2px;font-weight:700}
.b-yang{background:var(--yang-glow);color:var(--yang)}
.b-eum{background:var(--eum-glow);color:var(--eum)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-muted{background:rgba(0,0,0,.05);color:var(--muted)}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
.stat-box{background:var(--dobok);border:1px solid var(--border);border-radius:3px;padding:1.1rem 1.35rem;position:relative;overflow:hidden}
.stat-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.s1::after{background:var(--yang)}.s2::after{background:var(--ok)}.s3::after{background:var(--eum)}
.sl{font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
.sv{font-family:'Nanum Myeongjo',serif;font-size:38px;font-weight:800;color:var(--ink);line-height:1}
.sv.yang{color:var(--yang)}
.sh{font-size:11px;color:var(--muted);font-weight:300;margin-top:5px}

/* belt indicator */
.belt-ind{display:flex;align-items:center;gap:12px;background:var(--dobok);border:1px solid var(--border);border-radius:3px;padding:.82rem 1.2rem;margin-bottom:1.25rem}
.belt-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0}
.belt-ind-info{flex:1}
.belt-ind-name{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;color:var(--ink)}
.belt-ind-hangul{font-family:'Noto Sans KR',sans-serif;font-size:10px;color:var(--muted-light);letter-spacing:2px;margin-top:1px}
.belt-bar{height:5px;background:var(--linen);border-radius:3px;overflow:hidden;margin-top:5px}
.belt-fill{height:100%;border-radius:3px;transition:width 1.2s ease}
.belt-pts-txt{font-size:10px;color:var(--muted);margin-top:3px;font-weight:300}

/* reservas */
.res-row{display:flex;align-items:center;padding:.88rem 1.4rem;border-bottom:1px solid rgba(0,0,0,.04);gap:1rem}
.res-row:last-child{border-bottom:none}
.res-date{text-align:center;min-width:42px}

/* ── TOAST HOOK ── */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const add = (msg, type="ok", icon="✓") => {
    const id = Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,type,icon}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),5500);
  };
  return [toasts,add];
}
function Toasts({toasts}){
  return <div className="toast-wrap">{toasts.map(t=>(
    <div key={t.id} className={"toast t-"+t.type}>
      <span className="t-icon">{t.icon}</span><span>{t.msg}</span>
    </div>))}</div>;
}

    e.preventDefault(); setError(""); setLoading(true);
    if(staffOn&&code!==STAFF_CODE){setError("Código de acceso restringido inválido. Acceso denegado.");setLoading(false);return;}
    const {error:err}=await sb.auth.signInWithPassword({email,password:pass});
    if(err){setError("Credenciales incorrectas — intenta de nuevo.");setLoading(false);return;}
    if(staffOn) await sb.auth.updateUser({data:{is_staff:true}});
    else await sb.auth.updateUser({data:{is_staff:false}});
    setLoading(false);
  };

  return(
    <div className="auth-page">

      </div>
      <div className="auth-right">
        <div className="auth-card">
          <AuthBrand/>
          <div className="auth-title">Acceso al Dojang</div>
          <div className="auth-sub">도장 입장 — Ingresa tus credenciales</div>
          {error&&<div className="alert-err">{error}</div>}
          <form onSubmit={submit}>
            <div className="fg"><label className="fl">Correo · 이메일</label>
              <input className="fi" type="email" placeholder="sabonim@ko-ffee.ec" value={email} onChange={e=>setEmail(e.target.value)} required/></div>
            <div className="fg"><label className="fl">Contraseña · 비밀번호</label>
              <input className="fi" type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} required/></div>

function CartDrawer({carrito,onClose,onUpdate,onRemove,onCheckout}){
  const sub=carrito.reduce((s,x)=>s+x.precio*x.qty,0);
  const iva=sub*IVA; const total=sub+iva;
  const pts=Math.round(total*PTS_PER_DOLLAR);
  return(<>
    <div className="cart-overlay" onClick={onClose}/>
    <div className="cart-drawer">
      <div className="cart-hd">
        <div className="cart-title">🛒 Mi Pedido</div>
        <button className="btn-close" onClick={onClose}>✕</button>
      </div>
      <div className="cart-items">
        {carrito.length===0
          ?<div className="cart-empty"><div style={{fontSize:44,marginBottom:12,opacity:.25}}>☕</div>Tu carrito está vacío.<br/>Explora el menú del Dojang.</div>
          :carrito.map(x=>(
            <div className="ci" key={x.id}>
              <div className="ci-em">{x.emoji}</div>
              <div className="ci-info"><div className="ci-nm">{x.nombre}</div><div className="ci-pr">${(x.precio*x.qty).toFixed(2)}</div></div>
              <div className="ci-qty">
                <button className="qty-btn" onClick={()=>onUpdate(x.id,-1)}>−</button>
                <span className="qty-n">{x.qty}</span>
                <button className="qty-btn" onClick={()=>onUpdate(x.id,1)}>+</button>
                <button className="btn-rm" onClick={()=>onRemove(x.id)}>🗑</button>
              </div>
            </div>
          ))
        }
      </div>
      {carrito.length>0&&(
        <div className="cart-foot">
          <div>
            <div className="cart-line"><span>Subtotal</span><span>${sub.toFixed(2)}</span></div>
            <div className="cart-line"><span>IVA (12%)</span><span>${iva.toFixed(2)}</span></div>
            <div className="cart-total-line"><span>Total</span><span>${total.toFixed(2)}</span></div>

          </div>
        )}
        <textarea className="cmt-textarea" placeholder="Escribe tu experiencia, poomsae favorito o saludo a la comunidad KO-ffee… ☕🥋" value={text} onChange={e=>setText(e.target.value)}/>
        <button className="btn-cmt" onClick={addComment} disabled={!text.trim()}>Publicar en el Muro · 게시</button>
      </div>

      {comments.length===0
        ?<div className="panel"><div className="empty">Sé el primero en dejar un comentario en el Muro del Dojang 🥋 도장</div></div>
        :comments.map(c=>{
          const isBlackBelt=c.belt==="Negro";
          return(
            <div className="comment-card" key={c.id} style={isBlackBelt?{background:"var(--ink)",borderColor:"var(--gold)"}:{}}>
              <div className="cmt-meta">
                <div className="cmt-avatar" style={{background:c.beltColor||"var(--ink)",border:isBlackBelt?`2px solid var(--gold)`:"none"}}>{initials(c.author)}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span className="cmt-author-name" style={isBlackBelt?{color:"var(--dobok)"}:{}}>{c.author}</span>
                    {c.belt&&<span style={{fontSize:9,letterSpacing:1.2,textTransform:"uppercase",padding:"2px 7px",borderRadius:2,fontWeight:700,background:c.beltColor+"22",color:c.beltColor,border:`1px solid ${c.beltBorder||c.beltColor}44`}}>C. {c.belt} <span style={{fontFamily:"'Noto Sans KR',sans-serif",fontWeight:300}}>{c.beltKo}</span></span>}
                  </div>
                </div>
                <span className="cmt-time">{c.time}</span>
              </div>
              <div className="cmt-text" style={isBlackBelt?{color:"rgba(255,255,255,.65)"}:{}}>{c.text}</div>
            </div>
          );
        })
      }
    </div>
  );
}

function StaffDashboard({onSignOut,addToast,orders,reservas,onAdvance,onValidate,onUpdateReserva}){
  const [vista,setVista]=useState("kanban");
  const [search,setSearch]=useState(""); const [found,setFound]=useState(null); const [adj,setAdj]=useState("");

  const MOCK=[
    {nombre:"Lee Jae-won",email:"lee@ko-ffee.ec",puntos:8400,pedidos:12,reservas:3},
    {nombre:"Kim Min-ji",email:"kim@ko-ffee.ec",puntos:2100,pedidos:5,reservas:1},
    {nombre:"Park Sung-hoon",email:"park@ko-ffee.ec",puntos:32500,pedidos:28,reservas:8},
  ];
  const doSearch=()=>{const q=search.toLowerCase();setFound(MOCK.find(c=>c.nombre.toLowerCase().includes(q)||c.email.toLowerCase().includes(q))||"none");};

  const pending=orders.filter(o=>o.kStatus==="pendiente");
  const active=orders.filter(o=>o.kStatus==="espera"||o.kStatus==="preparacion");
  const done=orders.filter(o=>o.kStatus==="listo");

  const payLabel=m=>m==="card"?"💳 Tarjeta":m==="efectivo"?"💵 Efectivo":"🏦 Transferencia";

  const navItems=[{id:"kanban",icon:"🗂️",label:"KDS · 주문 관리"},{id:"reservas",icon:"📋",label:"Reservas · 예약"},{id:"clientes",icon:"👥",label:"Dojangsaeng · 수련생"}];

      <aside className="sidebar">

          <div className="sb-icon-wrap" style={{background:"linear-gradient(135deg,#8a0e1c,#001e6b)"}}>⚔️</div>
          <div className="sb-brand-text">
            <div className="sb-brand-name">KO<span>-ffee</span></div>
            <div className="sb-brand-hangul">사범님 패널</div>
          </div>
        </div>
        <nav className="sb-nav">
          <div className="sb-sec">Control del Dojang · 도장 관리</div>
          {navItems.map(n=><button key={n.id} className={"nav-btn"+(vista===n.id?" active":"")} onClick={()=>setVista(n.id)}><span className="ni">{n.icon}</span>{n.label}</button>)}

        <div className="sb-foot">
          <div style={{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(0,52,120,.15)",border:"1px solid rgba(0,52,120,.3)",borderRadius:2,padding:"2px 9px",fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"rgba(130,160,220,.7)",fontWeight:600,marginBottom:7}}>⚔️ Sabonim</div>
          <div className="sb-user-info">Panel de Administración</div>

        </div>
      </aside>
      <main className="main main-dark">

        {vista==="kanban"&&(
          <div>
            <div className="page-hd">
              <div className="page-title-dark">KDS — Gestión de Pedidos <span style={{fontFamily:"'Noto Sans KR',sans-serif",fontSize:16,fontWeight:300,color:"rgba(255,255,255,.2)"}}>주문 관리</span></div>
              <div className="page-sub" style={{color:"rgba(255,255,255,.3)"}}>Sistema Kyorugi — control en tiempo real de todos los pedidos del Dojang</div>
            </div>
            <div className="kanban">
              {/* PENDIENTE VALIDACIÓN */}
              <div className="kboard">
                <div className="kboard-hd">
                  <span className="kb-title">⏳ Pendiente Validación</span>
                  <div className="kb-count" style={{background:"rgba(176,122,26,.18)",color:"var(--warn)"}}>{pending.length}</div>
                </div>
                <div className="kboard-items">
                  {pending.length===0&&<div style={{fontSize:12,color:"rgba(255,255,255,.18)",fontStyle:"italic",padding:".5rem"}}>Sin pedidos pendientes</div>}
                  {pending.map(o=>(
                    <div className="korder pendiente" key={o.id}>
                      <div className="ko-id">PED-{String(o.id).slice(-3)}<span className={"ko-pay-tag "+payClass(o.payMethod)}>{payLabel(o.payMethod)}</span></div>
                      <div className="ko-items">{o.items.join("\n")}</div>
                      <div className="ko-meta">${o.total.toFixed(2)} · {o.fecha}</div>
                      <div className="ko-btns">
                        <button className="btn-ko btn-validate" onClick={()=>{onValidate(o.id);addToast(`✓ Pago validado — PED-${String(o.id).slice(-3)} pasa a En Espera`,"ok","✓");}}>✓ Validar Pago Sabonim</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* EN PREPARACIÓN */}
              <div className="kboard">
                <div className="kboard-hd">
                  <span className="kb-title">🔥 En Preparación</span>
                  <div className="kb-count" style={{background:"rgba(205,46,58,.15)",color:"var(--yang)"}}>{active.length}</div>
                </div>
                <div className="kboard-items">
                  {active.length===0&&<div style={{fontSize:12,color:"rgba(255,255,255,.18)",fontStyle:"italic",padding:".5rem"}}>Sin pedidos activos</div>}
                  {active.map(o=>(
                    <div className={"korder "+o.kStatus} key={o.id}>
                      <div className="ko-id">PED-{String(o.id).slice(-3)}<span className={"ko-pay-tag "+payClass(o.payMethod)}>{payLabel(o.payMethod)}</span></div>
                      <div className="ko-items">{o.items.join("\n")}</div>
                      <div className="ko-meta">${o.total.toFixed(2)} · {o.kStatus==="espera"?"En Espera":"En Preparación"}</div>
                      <div className="ko-btns">

                  <span className="kb-title">✅ Orden Lista</span>
                  <div className="kb-count" style={{background:"rgba(30,122,69,.15)",color:"rgba(80,200,120,.8)"}}>{done.length}</div>
                </div>
                <div className="kboard-items">
                  {done.length===0&&<div style={{fontSize:12,color:"rgba(255,255,255,.18)",fontStyle:"italic",padding:".5rem"}}>Sin órdenes listas</div>}
                  {done.map(o=>(
                    <div className="korder listo" key={o.id}>
                      <div className="ko-id">PED-{String(o.id).slice(-3)}<span className={"ko-pay-tag "+payClass(o.payMethod)}>{payLabel(o.payMethod)}</span></div>
                      <div className="ko-items">{o.items.join("\n")}</div>
                      <div className="ko-meta">${o.total.toFixed(2)}</div>
                      <div className="ko-btns"><button className="btn-ko btn-done-ko" disabled>✓ Lista para retirar · 완료</button></div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {vista==="reservas"&&(
          <div>
            <div className="page-hd">
              <div className="page-title-dark">Reservas · 예약 관리</div>
              <div className="page-sub" style={{color:"rgba(255,255,255,.3)"}}>Dojang Manager — gestión de espacios</div>
            </div>
            <div className="panel-dark">
              <div className="ph-dark"><span className="pt-w">Reservas Activas</span><span className="badge b-yang">{reservas.length}</span></div>
              {reservas.length===0?<div className="empty" style={{color:"rgba(255,255,255,.2)"}}>Sin reservas activas</div>
                :<table className="s-table">
                  <thead><tr><th>Mesa</th><th>Zona</th><th>Fecha</th><th>Hora</th><th>Pax</th><th>Estado</th><th>Acción</th></tr></thead>
                  <tbody>
                    {reservas.map((r,i)=>(
                      <tr key={i}>
                        <td style={{color:"var(--dobok)",fontWeight:600}}>Mesa {r.mesa}</td>
                        <td>{r.zona}</td><td>{r.dia} {r.mes}</td><td>{r.hora}</td><td>{r.personas}p</td>
                        <td><span className={"res-st "+(r.estado==="aceptada"?"rs-ok":"rs-pend")}>{r.estado==="aceptada"?"Aceptada":"Pendiente"}</span></td>
                        <td style={{display:"flex",gap:6}}>
                          {r.estado!=="aceptada"&&<button className="btn-s bs-a" onClick={()=>{onUpdateReserva(i,"aceptada");addToast(`📅 Reserva aceptada — ${r.zona} Mesa ${r.mesa} · Sabonim notificado`,"ok","📅");}}>Aceptar · 확인</button>}
                          {r.estado==="aceptada"&&<button className="btn-s bs-f" disabled>Finalizada</button>}

        {vista==="clientes"&&(
          <div>
            <div className="page-hd">
              <div className="page-title-dark">Dojangsaeng · 수련생 관리</div>

              <div className="ph-dark"><span className="pt-w">Buscador de Miembros</span></div>
              <div className="search-bar">
                <input className="search-inp" placeholder="Nombre o correo del Dojangsaeng…" value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}/>
                <button className="btn-search" onClick={doSearch}>Buscar · 검색</button>
              </div>
              <div style={{padding:"1.1rem 1.4rem"}}>
                {found==="none"&&<div style={{color:"rgba(255,255,255,.25)",fontSize:13,fontStyle:"italic"}}>No se encontró ningún Dojangsaeng con ese criterio.</div>}
                {found&&found!=="none"&&(
                  <div className="client-card">
                    <div className="cc-name">{found.nombre}</div>
                    <div className="cc-meta">{found.email} · {getBelt(found.puntos).en} ({getBelt(found.puntos).ko})</div>
                    <div className="cc-stats">
                      <div className="cc-stat"><div className="ccv yang">{found.puntos.toLocaleString()}</div><div className="ccl">Puntos</div></div>
                      <div className="cc-stat"><div className="ccv">{found.pedidos}</div><div className="ccl">Pedidos</div></div>
                      <div className="cc-stat"><div className="ccv">{found.reservas}</div><div className="ccl">Reservas</div></div>
                    </div>
                    <div className="pts-adj">
                      <input className="pts-adj-inp" type="number" placeholder="Puntos a ajustar…" value={adj} onChange={e=>setAdj(e.target.value)}/>
                      <button className="btn-pts-a" onClick={()=>{if(adj){addToast(`+${parseInt(adj).toLocaleString()} pts → ${found.nombre.split(" ")[0]}`,"ok","✓");setAdj("");}}}>+ Añadir</button>

              </div>
            </div>
          </div>
        )}
      </main>
    </div>
  );
}

/* ══════════════════════════════════════════
   CLIENT SHELL
══════════════════════════════════════════ */
function ClientShell({user,addToast,sharedOrders,onAddOrder,onGoMuro}){
  const meta=user.user_metadata||{};
  const nombre=meta.nombre_completo||user.email;
  const primerNombre=nombre.split(" ")[0];
  const belt=getBelt(meta.puntos||0);

  const [vista,setVista]=useState("panel");
  const [pedidos,setPedidos]=useState([]);
  const [reservas,setReservas]=useState([]);
  const [puntos,setPuntos]=useState(0);
  const [carrito,setCarrito]=useState([]);
  const [showCart,setShowCart]=useState(false);
  const [checkout,setCheckout]=useState(null);
  const prevOrdersRef=useRef([]);

  // Sync order status from staff
  useEffect(()=>{
    sharedOrders.forEach(shared=>{
      const prev=prevOrdersRef.current.find(o=>o.id===shared.id);
      if(prev&&prev.kStatus!==shared.kStatus){
        if(shared.kStatus==="preparacion") addToast("🔥 ¡Sabonim Kyorugi! Tu pedido ha entrado a preparación","warn","🔥");
        if(shared.kStatus==="listo") addToast("✅ ¡Kyukpa! Tu orden está lista para retirar. ¡Comparte tu Poomsae en el Muro del Dojang! 💬","ok","✅");
      }
    });
    prevOrdersRef.current=[...sharedOrders];
  },[sharedOrders]);

  const addToCart=item=>setCarrito(c=>{const ex=c.find(x=>x.id===item.id);return ex?c.map(x=>x.id===item.id?{...x,qty:x.qty+1}:x):[...c,{...item,qty:1}];});
  const updateQty=(id,d)=>setCarrito(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const removeItem=id=>setCarrito(c=>c.filter(x=>x.id!==id));
  const handleCheckout=resumen=>{setShowCart(false);setCheckout(resumen);setVista("checkout");};

  const confirmPay=(method,subM)=>{
    const payMethod=method==="card"?"card":subM;
    const now=new Date();
    const M=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    const fecha=`${now.getDate()} ${M[now.getMonth()]} ${now.getFullYear()}`;
    const id=Date.now();
    const kStatus=payMethod==="card"?"espera":"pendiente";
    const order={id,items:carrito.map(x=>x.qty>1?`${x.nombre} ×${x.qty}`:x.nombre),total:checkout.total,pts:checkout.pts,fecha,payMethod,kStatus};
    setPedidos(p=>[...p,order]);
    onAddOrder(order);
    if(payMethod==="card"){
      setPuntos(p=>p+checkout.pts);
      addToast(`☕ ¡Poomsae completado! +${checkout.pts.toLocaleString()} pts acreditados`,"ok","☕");
      setTimeout(()=>addToast("🥋 Pedido ingresó al Dojang — el Sabonim prepara tu orden","warn","🥋"),1400);
    } else {
      addToast(`⏳ Pedido enviado — Pendiente de validación por el Sabonim`,"warn","⏳");
      if(payMethod==="efectivo") addToast("💵 Recuerda pagar en caja al llegar al Dojang","warn","💵");
    }
    setCarrito([]);setCheckout(null);setVista("panel");
  };

  const cartCount=carrito.reduce((s,x)=>s+x.qty,0);
  const isBlack=belt.en==="Negro";
  const navItems=[{id:"panel",icon:"🏠",label:"Mi Panel 내 패널"},{id:"menu",icon:"☕",label:"Menú Kyukpa 메뉴"},{id:"reservas",icon:"📅",label:"Reservar 예약"}];

  return(
    <div className="app">
      <aside className="sidebar">
        <div className="sb-top">
          <div className="sb-icon-wrap"><TaegeukSymbol size={20}/></div>
          <div className="sb-brand-text">
            <div className="sb-brand-name">KO<span>-ffee</span></div>
            <div className="sb-brand-hangul">커피 도장</div>
          </div>
        </div>
        <nav className="sb-nav">
          <div className="sb-sec">Mi Dojang · 나의 도장</div>
          {navItems.map(n=><button key={n.id} className={"nav-btn"+(vista===n.id&&vista!=="checkout"?" active":"")} onClick={()=>{setVista(n.id);setCheckout(null);}}><span className="ni">{n.icon}</span>{n.label}</button>)}
          <div className="sb-sec" style={{marginTop:8}}>Comunidad · 커뮤니티</div>
          <button className="nav-btn" onClick={onGoMuro}><span className="ni">💬</span>Muro del Dojang 도장</button>
        </nav>
        <div className="sb-foot">
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,padding:"0 .2rem"}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:belt.color,border:`1.5px solid ${belt.border}`,flexShrink:0}}/>
            <span style={{fontSize:10,color:"rgba(255,255,255,.3)",fontWeight:300,letterSpacing:.3}}>C. {belt.en} · {belt.ko}</span>
          </div>
          <div className="sb-user-info">👤 <strong>{primerNombre}</strong> · {puntos.toLocaleString()} pts</div>
          <button className="btn-signout" onClick={()=>sb.auth.signOut()}>Cerrar sesión · 로그아웃</button>
        </div>
      </aside>
      <main className="main main-light">
        {vista==="panel"&&<PanelGeneral pedidos={pedidos} reservas={reservas} puntos={puntos}/>}
        {vista==="menu"&&<MenuPage onAdd={addToCart}/>}
        {vista==="reservas"&&<ReservasPage onReserva={r=>{setReservas(p=>[...p,r]);addToast("📅 Reserva enviada — el Sabonim la confirmará pronto","ok","📅");}}/>}
        {vista==="checkout"&&checkout&&<CheckoutPage resumen={checkout} carrito={carrito} onConfirm={confirmPay} onBack={()=>{setVista("menu");setCheckout(null);}}/>}
      </main>
      {carrito.length>0&&vista!=="checkout"&&(
        <button className="cart-fab" onClick={()=>setShowCart(true)}>
          <span>🛒 Pedido</span>
          <span className="cart-fab-n">{cartCount}</span>
          <span style={{color:"rgba(255,255,255,.45)",fontSize:11}}>${carrito.reduce((s,x)=>s+x.precio*x.qty,0).toFixed(2)}</span>
        </button>
      )}
      {showCart&&<CartDrawer carrito={carrito} onClose={()=>setShowCart(false)} onUpdate={updateQty} onRemove={removeItem} onCheckout={handleCheckout}/>}
    </div>
  );
}

/* ══════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState("landing");
  const [session,setSession]=useState(null);
  const [loading,setLoading]=useState(true);
  const [isStaff,setIsStaff]=useState(false);
  const [toasts,addToast]=useToasts();
  const [sharedOrders,setSharedOrders]=useState([]);
  const [sharedReservas,setSharedReservas]=useState([]);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setSession(session);
      if(session){setIsStaff(session.user?.user_metadata?.is_staff||false);setScreen("app");}
      setLoading(false);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_e,session)=>{
      setSession(session);
      if(session){setIsStaff(session.user?.user_metadata?.is_staff||false);setScreen("app");}
      else setScreen("landing");
    });
    return()=>subscription.unsubscribe();
  },[]);

  const advanceOrder=id=>setSharedOrders(prev=>prev.map(o=>{
    if(o.id!==id) return o;
    return{...o,kStatus:o.kStatus==="espera"?"preparacion":o.kStatus==="preparacion"?"listo":"listo"};
  }));
  const validateOrder=id=>setSharedOrders(prev=>prev.map(o=>o.id===id?{...o,kStatus:"espera"}:o));
  const updateReserva=(i,estado)=>setSharedReservas(prev=>prev.map((r,idx)=>idx===i?{...r,estado}:r));

  if(loading) return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--ink)",color:"rgba(255,255,255,.2)",fontSize:13,fontFamily:"'Inter',sans-serif",gap:12}}><TaegeukSymbol size={20}/> Cargando KO-ffee…</div>;

  return(<>
    <Toasts toasts={toasts}/>
    {screen==="landing"&&<LandingPage onLogin={()=>setScreen("login")} onMuro={()=>setScreen("muro")}/>}
    {screen==="login"&&<LoginForm onSwitch={()=>setScreen("register")}/>}
    {screen==="register"&&<RegisterForm onSwitch={()=>setScreen("login")}/>}
    {screen==="muro"&&(
      <div style={{background:"var(--ivory)",minHeight:"100vh",padding:"2.5rem"}}>
        <MuroDojang currentUser={session?.user||null} onBack={()=>setScreen(session?"app":"landing")}/>
      </div>
    )}
    {screen==="app"&&session&&(
      isStaff
        ?<StaffDashboard onSignOut={()=>sb.auth.signOut()} addToast={addToast} orders={sharedOrders} reservas={sharedReservas} onAdvance={advanceOrder} onValidate={validateOrder} onUpdateReserva={updateReserva}/>
        :<ClientShell user={session.user} addToast={addToast} sharedOrders={sharedOrders} onAddOrder={o=>setSharedOrders(p=>[...p,o])} onGoMuro={()=>setScreen("muro")}/>
    )}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
